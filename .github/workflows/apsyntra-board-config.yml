name: APSYNTRA Board Config — Disposable PostgreSQL Acceptance

on:
  push:
    branches: [main]
    paths:
      - "sql/cp-board-config01-*.sql"
      - "sql/tests/cp-board-config01-*.sql"
      - ".github/workflows/apsyntra-board-config.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-board-config-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test protected schema, RBAC, settings CAS and guarded rollback
        env:
          PGPASSWORD: disposable_only
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGDATABASE: postgres
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql -v ON_ERROR_STOP=1 \
            -f sql/tests/cp-board-collab01-disposable-setup.sql \
            -f sql/tests/cp-board-config01-disposable-setup.sql \
            -f sql/tests/cp-board-config01-disposable-legacy-live-functions.sql \
            -f sql/cp-board-config01-staged-authorization-v2.sql \
            -f sql/tests/cp-board-config01-disposable-acceptance.sql \
            -f sql/tests/cp-board-config01-dependency-acceptance-v2.sql \
            -f sql/cp-board-config01-compensating-rollback-v2.sql \
            -f sql/tests/cp-board-config01-rollback-acceptance-v2.sql
