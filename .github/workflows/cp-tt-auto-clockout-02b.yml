name: CP-TT-AUTO-CLOCKOUT-02B — Atomic Projection Restore Acceptance

on:
  pull_request:
    paths:
      - "supabase/migrations/20261119200735_cp_tt_auto_clockout_01_conditional_session_expiration.sql"
      - "supabase/migrations/20261119203503_cp_tt_auto_clockout_01_snapshot_overtime_cutoff.sql"
      - "supabase/migrations/20261119203633_cp_tt_auto_clockout_01_snapshot_overtime_cutoff_fix.sql"
      - "supabase/migrations/20261119204157_cp_tt_auto_clockout_01_grace_overtime_boundary.sql"
      - "sql/tests/cp-tt-auto-clockout-02-disposable-*.sql"
      - "sql/tests/cp-tt-auto-clockout-02b-disposable-acceptance.sql"
      - "supabase/migrations/20261120100000_cp_tt_employee_departments_qol.sql"
      - "supabase/migrations/20261120140000_cp_tt_department_catalog_management.sql"
      - "supabase/migrations/20261120150000_cp_tt_auto_clockout_02b_atomic_board_projection_restore.sql"
      - ".github/workflows/cp-tt-auto-clockout-02b.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20261119200735_cp_tt_auto_clockout_01_conditional_session_expiration.sql"
      - "supabase/migrations/20261119203503_cp_tt_auto_clockout_01_snapshot_overtime_cutoff.sql"
      - "supabase/migrations/20261119203633_cp_tt_auto_clockout_01_snapshot_overtime_cutoff_fix.sql"
      - "supabase/migrations/20261119204157_cp_tt_auto_clockout_01_grace_overtime_boundary.sql"
      - "sql/tests/cp-tt-auto-clockout-02-disposable-*.sql"
      - "sql/tests/cp-tt-auto-clockout-02b-disposable-acceptance.sql"
      - "supabase/migrations/20261120100000_cp_tt_employee_departments_qol.sql"
      - "supabase/migrations/20261120140000_cp_tt_department_catalog_management.sql"
      - "supabase/migrations/20261120150000_cp_tt_auto_clockout_02b_atomic_board_projection_restore.sql"
      - ".github/workflows/cp-tt-auto-clockout-02b.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-postgres-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_only
          POSTGRES_DB: apsyntra_tt_auto_clockout_02_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d apsyntra_tt_auto_clockout_02_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: apsyntra_tt_auto_clockout_02_disposable
      PGUSER: postgres
      PGPASSWORD: disposable_only
      PGCONNECT_TIMEOUT: "5"
      PGOPTIONS: "-c statement_timeout=30000"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Assert disposable PostgreSQL identity
        run: |
          set -euo pipefail
          test "$PGDATABASE" = apsyntra_tt_auto_clockout_02_disposable
          psql -X -v ON_ERROR_STOP=1 -Atqc "SELECT current_database(), current_setting('server_version_num')::integer >= 170000" | grep -Fx 'apsyntra_tt_auto_clockout_02_disposable|t'
      - name: Install existing TimeTracker disposable prerequisites
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 \
            -f sql/tests/cp-board-collab01-disposable-setup.sql \
            -f sql/tests/cp-tt-gps01-disposable-setup.sql \
            -f sql/tests/cp-tt-gps01-live-commit-baseline.sql \
            -f sql/cp-tt-gps01-atomic-board-projection.sql \
            -f sql/tests/cp-tt-admin-record-management-disposable-setup.sql \
            -f sql/cp-tt-ot01-staged-bootstrap-approval.sql \
            -f sql/tests/cp-tt-auto-clockout-02-disposable-setup.sql
      - name: Install automatic Clock-Out migrations in isolation
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261119200735_cp_tt_auto_clockout_01_conditional_session_expiration.sql \
            -f supabase/migrations/20261119203503_cp_tt_auto_clockout_01_snapshot_overtime_cutoff.sql \
            -f supabase/migrations/20261119203633_cp_tt_auto_clockout_01_snapshot_overtime_cutoff_fix.sql \
            -f supabase/migrations/20261119204157_cp_tt_auto_clockout_01_grace_overtime_boundary.sql
      - name: Execute signed employee, overtime, worker, audit and Board lifecycle acceptance
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-tt-auto-clockout-02-disposable-acceptance.sql
      - name: Exercise department/catalog migration drift and atomic projection repair
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261120100000_cp_tt_employee_departments_qol.sql \
            -f supabase/migrations/20261120140000_cp_tt_department_catalog_management.sql
          psql -X -v ON_ERROR_STOP=1 -Atqc "SELECT position('tt_board_projection_upsert' in pg_get_functiondef('public.timetracker_attendance_commit_v2(uuid,text,text,text,text,jsonb,text)'::regprocedure))=0" | grep -Fx t
          psql -X -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261120150000_cp_tt_auto_clockout_02b_atomic_board_projection_restore.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-tt-auto-clockout-02b-disposable-acceptance.sql
