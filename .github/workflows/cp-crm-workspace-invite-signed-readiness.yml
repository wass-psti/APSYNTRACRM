name: CP-CRM-WORKSPACE-INVITE Signed Readiness and SMTP Delivery Gate
on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/ws02d-trusted.ts'
      - 'supabase/functions/_shared/ws02d-readiness.mjs'
      - 'frontend/app.js'
      - 'frontend/workspace-ui.js'
      - 'frontend/workspace-invitation-management.js'
      - 'server/tests/ws02d-signed-readiness.test.mjs'
      - 'docs/CP-CRM-WORKSPACE-INVITE-SIGNED-READINESS.md'
      - '.github/workflows/cp-crm-workspace-invite-signed-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-readiness-provider-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify signed readiness and all invitation regressions
        run: node --test server/tests/ws02d-*.test.mjs frontend/tests/workspace-invitation*.test.mjs frontend/tests/workspace-ui.test.mjs frontend/tests/cp-crm-workspace-invite-ui-activation.test.mjs
      - name: Check production bundle and migration integrity
        run: npm run build && node scripts/verify-migration-source-manifest.mjs
