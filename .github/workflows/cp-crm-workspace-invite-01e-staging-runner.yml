name: CP-CRM-WORKSPACE-INVITE-01E Signed Staging Transport
on:
  pull_request:
    paths:
      - 'server/ws02d-genuine-staging-runner.mjs'
      - 'server/tests/ws02d-01e-signed-staging-runner.test.mjs'
      - 'scripts/cp-crm-workspace-invite-01e-staging.mjs'
      - '.github/workflows/cp-crm-workspace-invite-01e-staging-runner.yml'
      - 'docs/CP-CRM-WORKSPACE-INVITE-01E.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-credentials-signed-staging-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify migration source integrity
        run: node scripts/verify-migration-source-manifest.mjs
      - name: Verify trusted staging transport and existing invitation contracts
        run: node --test server/tests/ws02d-01e-signed-staging-runner.test.mjs server/tests/ws02d-01d-source.test.mjs server/tests/ws02d-staging-readiness.test.mjs server/tests/ws02d-invitation-http-boundary.test.mjs server/tests/ws02d-invitation-accept-http-boundary.test.mjs server/tests/ws02d-resend-transport.test.mjs frontend/tests/workspace-invitation-client.test.mjs frontend/tests/workspace-invitation-acceptance.test.mjs
      - name: Verify absent staging credentials cannot accidentally trigger an invitation
        run: |
          if env -u WS02D_STAGING_ANON_KEY -u WS02D_STAGING_INVITER_JWT -u WS02D_STAGING_RECIPIENT_JWT node scripts/cp-crm-workspace-invite-01e-staging.mjs preflight; then
            echo 'FAILED: preflight succeeded without signed accounts'; exit 1
          fi
