name: CP-TL-RH05 Disposable Historical PDF Browser Acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/cp-tl-rh05-historical-browser.yml'
      - 'scripts/tradelink-historical-reprint-browser-acceptance.mjs'
      - 'frontend/tradelink-saved-document-output.js'
      - 'frontend/tradelink-application.css'
      - 'frontend/tradelink-draft-workspace.js'
      - 'frontend/tradelink-domain-client.js'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  historical-browser:
    name: Synthetic historical Approved revision to A4 PDF (Chromium)
    runs-on: ubuntu-24.04 # Playwright 1.56.1 supports Ubuntu 24.04, not 26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify immutable historical PDF through real Chromium
        run: node scripts/tradelink-historical-reprint-browser-acceptance.mjs
