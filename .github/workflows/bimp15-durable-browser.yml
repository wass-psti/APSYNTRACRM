name: APSYNTRA BIMP-15A Disposable Chromium Recovery Acceptance
on:
  pull_request:
    paths:
      - 'frontend/board-import-*.js'
      - 'frontend/tests/fixtures/board-import-durable-browser.html'
      - 'frontend/tests/board-import-durable.test.mjs'
      - 'scripts/bimp15-durable-browser.mjs'
      - '.github/workflows/bimp15-durable-browser.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/board-import-*.js'
      - 'frontend/tests/fixtures/board-import-durable-browser.html'
      - 'frontend/tests/board-import-durable.test.mjs'
      - 'scripts/bimp15-durable-browser.mjs'
      - '.github/workflows/bimp15-durable-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  durable-import-browser:
    name: Disposable Chromium source reupload, signed-fixture roundtrip, refresh persistence
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Run durable import unit regression
        run: node --test frontend/tests/board-import-durable.test.mjs
      - name: Run isolated real Chromium UI recovery without production credentials
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER" || { echo 'BLOCKED: Chromium unavailable'; exit 1; }
          # Retry an isolated Chrome startup failure only (exit 75), not
          # a failed import assertion, denied action, or persisted-cell mismatch.
          set +e
          CHROME_BIN="$BROWSER" node scripts/bimp15-durable-browser.mjs
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then exit 0; fi
          if [ "$code" -ne 75 ]; then exit "$code"; fi
          echo 'Chromium debugging startup unavailable; retrying once with a fresh profile.'
          sleep 2
          CHROME_BIN="$BROWSER" node scripts/bimp15-durable-browser.mjs
