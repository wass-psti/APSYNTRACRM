name: CP-URM-SCOPED-02A Fund Tracker Workspace Roles
on:
  pull_request:
    paths:
      - 'frontend/user-role-management.js'
      - 'frontend/user-role-batch.js'
      - 'frontend/app.js'
      - 'frontend/tests/user-role-frt-scoped.test.mjs'
      - 'supabase/migrations/20261118052000_cp_urm_scoped02a_frt_roles.sql'
      - 'supabase/migration-source-manifest.json'
      - 'sql/tests/cp-urm-scoped02-frt-*.sql'
      - '.github/workflows/cp-urm-scoped02-frt.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frt-workspace-roles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify migration manifest
        run: node scripts/verify-migration-source-manifest.mjs
      - name: Verify actual SQL in isolated PostgreSQL 17
        env:
          PGPASSWORD: disposable_only
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGDATABASE: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 \
            -f sql/tests/cp-urm-scoped02-frt-setup.sql \
            -f supabase/migrations/20261118052000_cp_urm_scoped02a_frt_roles.sql \
            -f sql/tests/cp-urm-scoped02-frt-acceptance.sql
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run scoped role client regressions
        run: node --test frontend/tests/user-role-frt-scoped.test.mjs
      - name: Full frontend regression and production build
        run: |
          npm ci
          node --test frontend/tests/*.test.mjs
          npm run build
