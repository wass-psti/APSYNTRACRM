name: CP-CRM-PERF-01B Signed Application Baseline
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cp-crm-perf-01b.yml'
      - 'scripts/cp-crm-perf-01b-fueltrans.mjs'
      - 'frontend/tests/crm-perf-01b-fueltrans.test.mjs'
      - 'frontend/app.js'
      - 'frontend/data.js'
      - 'frontend/session.js'
      - 'frontend/platform-sync.js'
      - 'frontend/workspace-application-ownership.js'
      - 'frontend/native-application-access.js'
      - 'frontend/fueltrans/**'
      - 'scripts/cp-ft-ui06-gotrue-postgrest.sh'
      - 'scripts/cp-ft-ui06-two-session.mjs'
      - 'supabase/migrations/*fueltrans*'
      - 'supabase/migrations/*native*'
      - 'supabase/migrations/*workspace*'
      - 'supabase/migrations/*board_group_view*'
      - 'sql/tests/cp-crm-perf-01b-board-group-view-regression.sql'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  board-group-view-regression:
    name: Board group-view RPC regression (PostgreSQL 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: board_group_view_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d board_group_view_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: board_group_view_disposable
      PGUSER: postgres
      PGPASSWORD: disposable_ci_only
      PGCONNECT_TIMEOUT: '5'
      PGOPTIONS: '-c statement_timeout=30000'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install PostgreSQL CLI (disposable runner only)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Assert isolated PostgreSQL runner identity
        run: |
          set -euo pipefail
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = board_group_view_disposable
          psql -X -v ON_ERROR_STOP=1 -Atqc "SELECT current_database(), current_setting('server_version_num')::integer >= 170000" | grep -Fx 'board_group_view_disposable|t'
      - name: Reproduce SQLSTATE 42883 and verify corrected Board group-view RPCs
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-crm-perf-01b-board-group-view-regression.sql
  fueltrans:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test frontend/tests/crm-perf-01b-fueltrans.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Real signed disposable FuelTrans benchmark
        env:
          CP_CRM_PERF_01B_FUELTRANS: '1'
        run: bash scripts/cp-ft-ui06-gotrue-postgrest.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crm-perf-01b-fueltrans
          path: artifacts/crm-perf-01b-fueltrans.json
          if-no-files-found: error
          retention-days: 30
