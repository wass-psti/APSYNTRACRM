name: CP-MS-CRM-05D.2B disposable client PO compatibility
on:
  pull_request:
    paths:
      - 'sql/mrh-procurement-client-po-CANDIDATE-NOT-APPLIED.sql'
      - 'sql/tests/mrh-procurement-client-po-compatibility.sql'
      - 'supabase/migrations/20261128154448_cp_ms_crm_05d2c_mrh_procurement_client_po.sql'
      - 'frontend/apps/MaterialSourcing/procurement-workflow-ui.js'
      - '.github/workflows/cp-ms-crm-05d2b-client-po.yml'
permissions:
  contents: read
jobs:
  client-po-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Independently reproduce and verify client PO compatibility
        run: |
          set -euo pipefail
          NAME="mrh-client-po-$GITHUB_RUN_ID"
          docker run --rm -d --name "$NAME" -e POSTGRES_PASSWORD=isolatedtest postgres@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f >/dev/null
          trap 'docker rm -f "$NAME" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if docker exec "$NAME" pg_isready -U postgres >/dev/null; then break; fi
            sleep 1
          done
          docker cp sql/tests/mrh-atomic-edit-live-dependencies.sql "$NAME:/tmp/mrh-live-dependencies.sql"
          docker cp sql/tests/mrh-procurement-fixture.sql "$NAME:/tmp/mrh-procurement-fixture.sql"
          docker cp sql/mrh-procurement-CANDIDATE-NOT-APPLIED.sql "$NAME:/tmp/mrh-procurement.sql"
          cmp sql/mrh-procurement-client-po-CANDIDATE-NOT-APPLIED.sql supabase/migrations/20261128154448_cp_ms_crm_05d2c_mrh_procurement_client_po.sql
          docker cp supabase/migrations/20261128154448_cp_ms_crm_05d2c_mrh_procurement_client_po.sql "$NAME:/tmp/mrh-client-po-candidate.sql"
          docker exec -i "$NAME" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -q < sql/tests/mrh-procurement-client-po-compatibility.sql
