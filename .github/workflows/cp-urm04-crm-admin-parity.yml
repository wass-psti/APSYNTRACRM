name: CP-URM-04 CRM Administrator parity (staged)
on:
  pull_request:
    paths:
      - 'sql/cp-urm04-*'
      - 'sql/tests/cp-urm04-*'
      - 'scripts/cp-urm04-*'
      - 'frontend/app.js'
      - 'frontend/data.js'
      - 'frontend/role-configuration-client.js'
      - 'frontend/tests/cp-urm04-*'
      - '.github/workflows/cp-urm04-crm-admin-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-admin-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate frontend signed admin-tier and protected bootstrap identity contracts
        run: node --test frontend/tests/cp-urm04-admin-parity.test.mjs
      - name: Validate PostgreSQL 17 effective Admin, workspace isolation, revocation and non-admin denial
        run: bash scripts/cp-urm04-disposable-admin-parity.sh
