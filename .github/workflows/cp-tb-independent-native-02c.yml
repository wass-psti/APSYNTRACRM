name: CP-TB Native 02C PostgreSQL Timer and V2 Activation Preflight
on:
  pull_request:
    paths:
      - "supabase/migration-candidates/cp_tb_independent_native_02c_server_timer.sql"
      - "scripts/tests/talkbox-native-02c-pg.test.mjs"
      - "frontend/talkbox-native.js"
      - "frontend/app.js"
      - "frontend/data.js"
      - "frontend/tests/talkbox-native-02c.test.mjs"
      - "frontend/tests/talkbox-native-02-backend.test.mjs"
      - "frontend/tests/board-cache-channel.test.mjs"
      - ".github/workflows/cp-tb-independent-native-02c.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migration-candidates/cp_tb_independent_native_02c_server_timer.sql"
      - "scripts/tests/talkbox-native-02c-pg.test.mjs"
      - "frontend/talkbox-native.js"
      - "frontend/app.js"
      - "frontend/data.js"
      - "frontend/tests/talkbox-native-02c.test.mjs"
      - "frontend/tests/talkbox-native-02-backend.test.mjs"
      - "frontend/tests/board-cache-channel.test.mjs"
      - ".github/workflows/cp-tb-independent-native-02c.yml"
permissions:
  contents: read
jobs:
  postgres17-and-native-timer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned isolated PostgreSQL 17 runtime
        run: npm install --prefix "$RUNNER_TEMP/tb-pg17" --no-save --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.16
      - name: Verify native 02B and 02C migrations against genuine PostgreSQL 17
        run: |
          export PGLITE_MODULE="$RUNNER_TEMP/tb-pg17/node_modules/@electric-sql/pglite/dist/index.js"
          node --test scripts/tests/talkbox-native-02c-pg.test.mjs
      - name: Install locked app dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Native timer contracts and cross-window cache coherence
        run: node --test frontend/tests/talkbox-native-02c.test.mjs frontend/tests/talkbox-native-02.test.mjs frontend/tests/board-cache-channel.test.mjs
      - name: Full frontend regression and production build
        run: |
          npm test
          npm run build
          node scripts/build-priority5-styles.mjs --check
