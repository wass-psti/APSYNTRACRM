name: Material Request Hub Atomic Creation Security
on:
  pull_request:
    paths:
      - 'frontend/material-sourcing-add-material.js'
      - 'frontend/material-sourcing-atomic-create.js'
      - 'frontend/material-sourcing-tracker.js'
      - 'frontend/app.js'
      - 'frontend/tests/material-sourcing-add-material.test.mjs'
      - 'frontend/tests/material-sourcing-atomic-create.test.mjs'
      - 'sql/mrh-atomic-material-create-PRODUCTION-ACTIVATED-20261111.sql'
      - 'sql/tests/mrh-atomic-material-disposable.sql'
      - '.github/workflows/mrh-atomic-create-security.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/material-sourcing-add-material.js'
      - 'frontend/material-sourcing-atomic-create.js'
      - 'frontend/material-sourcing-tracker.js'
      - 'frontend/app.js'
      - 'frontend/tests/material-sourcing-add-material.test.mjs'
      - 'frontend/tests/material-sourcing-atomic-create.test.mjs'
      - 'sql/mrh-atomic-material-create-PRODUCTION-ACTIVATED-20261111.sql'
      - 'sql/tests/mrh-atomic-material-disposable.sql'
      - '.github/workflows/mrh-atomic-create-security.yml'
permissions:
  contents: read
jobs:
  signed-atomic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Frontend atomic contract
        run: |
          node --check frontend/app.js
          node --check frontend/material-sourcing-atomic-create.js
          node --check frontend/material-sourcing-add-material.js
          node --test frontend/tests/material-sourcing-add-material.test.mjs frontend/tests/material-sourcing-atomic-create.test.mjs frontend/tests/material-sourcing-controlled-activation.test.mjs
      - name: PostgreSQL atomic save, replay, rollback and denial
        run: |
          set -euo pipefail
          NAME="mrh-atomic-$GITHUB_RUN_ID"
          docker run --rm -d --name "$NAME" -e POSTGRES_PASSWORD=isolatedtest postgres@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f >/dev/null
          trap 'docker rm -f "$NAME" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if docker exec "$NAME" pg_isready -U postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker cp sql/mrh-atomic-material-create-PRODUCTION-ACTIVATED-20261111.sql "$NAME:/tmp/mrh-atomic.sql"
          docker exec -i "$NAME" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -q < sql/tests/mrh-atomic-material-disposable.sql
