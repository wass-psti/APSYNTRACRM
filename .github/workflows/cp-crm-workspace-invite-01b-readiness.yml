name: CP-CRM-WORKSPACE-INVITE-01B Trusted Staging Readiness
on:
  pull_request:
    paths:
      - 'server/ws02d-staging-readiness.mjs'
      - 'server/tests/ws02d-staging-readiness.test.mjs'
      - 'server/tests/ws02d-dormant-edge-handlers.test.mjs'
      - '.github/workflows/cp-crm-workspace-invite-01b-readiness.yml'
      - 'docs/CP-CRM-WORKSPACE-INVITE-01B.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging-integration-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify source and migration integrity
        run: node scripts/verify-migration-source-manifest.mjs
      - name: Verify signed invitation trust boundaries and readiness
        run: node --test server/tests/ws02d-*.test.mjs frontend/tests/workspace-invitation*.test.mjs
