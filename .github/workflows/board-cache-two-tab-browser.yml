name: APSYNTRA Board Cache Two-Tab Browser Acceptance
on:
  pull_request:
    paths:
      - 'frontend/data.js'
      - 'frontend/board-cache-channel.js'
      - 'frontend/board-window.js'
      - 'frontend/board-grid.js'
      - 'frontend/board-presentation.js'
      - 'frontend/app.js'
      - 'frontend/styles.css'
      - 'frontend/tests/board-window.test.mjs'
      - 'frontend/tests/fixtures/board-virtual-browser.html'
      - 'frontend/tests/fixtures/board-cache-two-tab.html'
      - 'frontend/tests/board-cache-channel.test.mjs'
      - 'frontend/tests/board-session-cache.test.mjs'
      - 'scripts/board-cache-two-tab-browser.mjs'
      - '.github/workflows/board-cache-two-tab-browser.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/data.js'
      - 'frontend/board-cache-channel.js'
      - 'frontend/board-window.js'
      - 'frontend/board-grid.js'
      - 'frontend/board-presentation.js'
      - 'frontend/app.js'
      - 'frontend/styles.css'
      - 'frontend/tests/board-window.test.mjs'
      - 'frontend/tests/fixtures/board-virtual-browser.html'
      - 'frontend/tests/fixtures/board-cache-two-tab.html'
      - 'frontend/tests/board-cache-channel.test.mjs'
      - 'frontend/tests/board-session-cache.test.mjs'
      - 'scripts/board-cache-two-tab-browser.mjs'
      - '.github/workflows/board-cache-two-tab-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  two-tab-browser:
    name: Synthetic two-tab Chromium and request-count acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify source-level cache isolation and request boundaries
        run: node --test frontend/tests/board-cache-channel.test.mjs frontend/tests/board-session-cache.test.mjs frontend/tests/board-window.test.mjs
      - name: Verify real two-tab sync and 600-row virtual window without production credentials
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER" || { echo 'BLOCKED: Chrome/Chromium unavailable'; exit 1; }
          CHROME_BIN="$BROWSER" node scripts/board-cache-two-tab-browser.mjs
