name: APSYNTRA Public Static Cache Browser Acceptance
on:
  pull_request:
    paths:
      - 'service-worker.js'
      - 'index.html'
      - 'frontend/static-cache-*.js'
      - 'frontend/tests/static-cache-service-worker.test.mjs'
      - 'scripts/static-cache-browser.mjs'
      - '.github/workflows/static-cache-browser.yml'
  push:
    branches: [main]
    paths:
      - 'service-worker.js'
      - 'index.html'
      - 'frontend/static-cache-*.js'
      - 'frontend/tests/static-cache-service-worker.test.mjs'
      - 'scripts/static-cache-browser.mjs'
      - '.github/workflows/static-cache-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-cache:
    name: Static-only SW security and isolated Chromium acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Test worker isolation, lifecycle and registration
        run: node --test frontend/tests/static-cache-service-worker.test.mjs
      - name: Test real Chromium Cache API and worker activation without credentials
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER" || { echo 'BLOCKED: Chrome/Chromium unavailable'; exit 1; }
          # Retry one isolated Chrome *startup* failure only (exit 75).
          # Genuine assertions and security-denial failures do not retry.
          set +e
          CHROME_BIN="$BROWSER" node scripts/static-cache-browser.mjs
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then exit 0; fi
          if [ "$code" -ne 75 ]; then exit "$code"; fi
          echo 'Hosted Chrome startup unavailable; retrying once with a fresh profile.'
          sleep 2
          CHROME_BIN="$BROWSER" node scripts/static-cache-browser.mjs
