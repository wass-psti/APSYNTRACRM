name: BS01 board-sharing isolated source checks
on:
  push:
    branches:
      - feat/board-scoped-guest-invites-20261110
    paths:
      - 'frontend/board-share.js'
      - 'frontend/resource-email-invitations.js'
      - 'frontend/tests/resource-email-invitations.test.mjs'
      - 'frontend/board-share-clean.css'
      - 'frontend/board-people.js'
      - 'frontend/board-people.css'
      - 'frontend/board-column-hover.css'
      - 'frontend/tests/board-column-hover.test.mjs'
      - 'index.html'
      - 'frontend/tests/board-people.test.mjs'
      - 'frontend/app.js'
      - 'frontend/tests/board-share*.test.mjs'
      - 'server/bs01-policy-http-boundary.mjs'
      - 'server/tests/bs01-policy-http-boundary.test.mjs'
      - 'server/bs01-local-*.mjs'
      - 'server/tests/bs01-local-lab.test.mjs'
      - 'frontend/bs01-local-lab.*'
      - 'sql/bs01-*.sql'
      - '.github/workflows/bs01-isolated-source-checks.yml'
  pull_request:
    paths:
      - 'frontend/board-share.js'
      - 'frontend/resource-email-invitations.js'
      - 'frontend/tests/resource-email-invitations.test.mjs'
      - 'frontend/board-share-clean.css'
      - 'frontend/board-people.js'
      - 'frontend/board-people.css'
      - 'frontend/board-column-hover.css'
      - 'frontend/tests/board-column-hover.test.mjs'
      - 'index.html'
      - 'frontend/tests/board-people.test.mjs'
      - 'frontend/app.js'
      - 'frontend/tests/board-share*.test.mjs'
      - 'server/bs01-policy-http-boundary.mjs'
      - 'server/tests/bs01-policy-http-boundary.test.mjs'
      - 'server/bs01-local-*.mjs'
      - 'server/tests/bs01-local-lab.test.mjs'
      - 'frontend/bs01-local-lab.*'
      - 'sql/bs01-*.sql'
      - '.github/workflows/bs01-isolated-source-checks.yml'
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check frontend/app.js
          node --check frontend/board-share.js
          node --check frontend/resource-email-invitations.js
          node --check frontend/board-people.js
          node --check server/bs01-policy-http-boundary.mjs
          node --check server/bs01-local-sandbox-core.mjs
          node --check server/bs01-local-lab-server.mjs
          node --check frontend/bs01-local-lab.js
      - name: BS01 fail-closed source and boundary tests
        run: |
          node --test frontend/tests/resource-email-invitations.test.mjs frontend/tests/board-presentation.test.mjs frontend/tests/board-column-hover.test.mjs frontend/tests/board-share.test.mjs frontend/tests/board-share-phase2.test.mjs frontend/tests/board-people.test.mjs frontend/tests/board-activity-ui.test.mjs frontend/tests/board-col01-readers.test.mjs frontend/tests/board-collaboration.test.mjs server/tests/bs01-policy-http-boundary.test.mjs server/tests/bs01-local-lab.test.mjs
      - name: Explain scope
        run: |
          echo "BS01 lab is an isolated loopback simulator; no real invitations, Supabase calls or SQL activation."
          echo "Production and genuine GoTrue/PostgreSQL acceptance remain separate."
