name: Temporary CP-CRM-PERF-01B Migration Name Generator
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cp-crm-perf-01b-migration-name.yml'
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13
        with:
          version: '2.121.0'
      - name: Generate migration filename with Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          cd "$temp_dir"
          supabase init
          supabase migration new cp_board_group_view_coalesce_fix
          find supabase/migrations -maxdepth 1 -type f -name '*_cp_board_group_view_coalesce_fix.sql' -printf '%f\n'
