name: FuelTrack Dashboard UI Acceptance
on:
  push:
    branches: [main]
    paths:
      - 'frontend/fueltrack-v3-signed-views.js'
      - 'frontend/fueltrack-v3-application.css'
      - 'frontend/fueltrack-v3-analytics.css'
      - 'frontend/app.js'
      - 'frontend/dark-native-applications.css'
      - 'frontend/apsyntra-styles.bundle.css'
      - 'frontend/tests/fueltrack-v3-signed-rich-views.test.mjs'
      - 'scripts/fueltrack-v3-native-browser-acceptance.mjs'
      - 'index.html'
      - '.github/workflows/fueltrack-dashboard-ui.yml'
      - 'frontend/fueltrack-v3-ui.js'
      - 'frontend/fueltrack-v3-application.js'
      - 'frontend/fueltrack-v3-all-requests-redesign.css'
      - 'frontend/tests/fueltrack-v3-signed-views.test.mjs'
      - 'frontend/tests/fueltrack-v3-all-requests-entrypoint.test.mjs'
      - 'scripts/pages-smoke.mjs'
      - 'frontend/fueltrack-v3-new-request.js'
      - 'frontend/fueltrack-v3-new-request-redesign.css'
      - 'frontend/tests/fueltrack-v3-new-request-ui.test.mjs'
      - 'scripts/priority5-style-manifest.mjs'
      - 'frontend/fueltrack-v3-approvals.js'
      - 'frontend/fueltrack-v3-approvals-redesign.css'
      - 'frontend/tests/fueltrack-v3-approvals.test.mjs'
  pull_request:
    paths:
      - 'frontend/fueltrack-v3-signed-views.js'
      - 'frontend/fueltrack-v3-application.css'
      - 'frontend/fueltrack-v3-analytics.css'
      - 'frontend/app.js'
      - 'frontend/dark-native-applications.css'
      - 'frontend/apsyntra-styles.bundle.css'
      - 'frontend/tests/fueltrack-v3-signed-rich-views.test.mjs'
      - 'scripts/fueltrack-v3-native-browser-acceptance.mjs'
      - 'index.html'
      - '.github/workflows/fueltrack-dashboard-ui.yml'
      - 'frontend/fueltrack-v3-ui.js'
      - 'frontend/fueltrack-v3-application.js'
      - 'frontend/fueltrack-v3-all-requests-redesign.css'
      - 'frontend/tests/fueltrack-v3-signed-views.test.mjs'
      - 'frontend/tests/fueltrack-v3-all-requests-entrypoint.test.mjs'
      - 'scripts/pages-smoke.mjs'
      - 'frontend/fueltrack-v3-new-request.js'
      - 'frontend/fueltrack-v3-new-request-redesign.css'
      - 'frontend/tests/fueltrack-v3-new-request-ui.test.mjs'
      - 'scripts/priority5-style-manifest.mjs'
      - 'frontend/fueltrack-v3-approvals.js'
      - 'frontend/fueltrack-v3-approvals-redesign.css'
      - 'frontend/tests/fueltrack-v3-approvals.test.mjs'
permissions:
  contents: read
jobs:
  dashboard:
    name: Signed dashboard renderer and responsive Chromium acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Check FuelTrack application entry syntax
        run: node --check frontend/app.js
      - name: Install Chromium for responsive browser acceptance
        run: npx playwright install --with-deps chromium
      - name: Run signed dashboard renderer and workflow regressions
        run: node --test frontend/tests/*.test.mjs
      - name: Verify deterministic production CSS bundle
        run: node scripts/build-priority5-styles.mjs --check
      - name: Run FuelTrack native Chromium acceptance
        run: node scripts/fueltrack-v3-native-browser-acceptance.mjs
