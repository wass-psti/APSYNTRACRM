name: Material Request Hub Sourcing Security Acceptance
on:
  pull_request:
    paths:
      - 'frontend/material-sourcing-*.js'
      - 'frontend/board-grid.js'
      - 'frontend/tests/material-sourcing-*.test.mjs'
      - 'sql/mrh-sourcing-sensitive-vault-CANDIDATE-NOT-APPLIED.sql'
      - 'sql/tests/mrh-sourcing-sensitive-disposable-*.sql'
      - '.github/workflows/material-sourcing-security.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/material-sourcing-*.js'
      - 'frontend/board-grid.js'
      - 'frontend/tests/material-sourcing-*.test.mjs'
      - 'sql/mrh-sourcing-sensitive-vault-CANDIDATE-NOT-APPLIED.sql'
      - 'sql/tests/mrh-sourcing-sensitive-disposable-*.sql'
      - '.github/workflows/material-sourcing-security.yml'
permissions:
  contents: read
jobs:
  frontend-denial:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify controlled signed CAS, deny-by-default fields and group preservation
        run: |
          node --check frontend/material-sourcing-controlled-activation.js
          node --check frontend/material-sourcing-application.js
          node --check frontend/board-grid.js
          node --test frontend/tests/material-sourcing-controlled-activation.test.mjs frontend/tests/material-sourcing-schema-plan.test.mjs frontend/tests/material-sourcing-application.test.mjs frontend/tests/board-structure-admin.test.mjs
  postgres-denial:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate candidate security SQL only in disposable PostgreSQL 17
        env:
          PGPASSWORD: disposable_only
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: postgres
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql -v ON_ERROR_STOP=1 \
            -f sql/tests/mrh-sourcing-sensitive-disposable-setup.sql \
            -f sql/mrh-sourcing-sensitive-vault-CANDIDATE-NOT-APPLIED.sql \
            -f sql/tests/mrh-sourcing-sensitive-disposable-acceptance.sql
