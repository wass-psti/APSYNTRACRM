name: CP-CRM-URM-INTEGRITY-03G Native Readback Acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/cp-crm-urm-integrity-03g-acceptance.yml'
      - 'scripts/cp-crm-urm-integrity-03g-acceptance.mjs'
      - 'frontend/tests/cp-crm-urm-integrity-03g.test.mjs'
      - 'docs/CP-CRM-URM-INTEGRITY-03G.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-readback-evidence-classification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify source integrity
        run: node scripts/verify-migration-source-manifest.mjs
      - name: Verify signed role and native evidence gates
        run: node --test frontend/tests/cp-crm-urm-integrity-02.test.mjs frontend/tests/cp-crm-urm-integrity-03.test.mjs frontend/tests/cp-crm-urm-integrity-03f.test.mjs frontend/tests/cp-crm-urm-integrity-03g.test.mjs frontend/tests/cp-urm-sidebar-native-capability.test.mjs frontend/tests/platform-sync.test.mjs
