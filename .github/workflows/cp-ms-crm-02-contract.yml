name: CP-MS-CRM-02 contract reconciliation
on:
  pull_request:
    paths:
      - 'integrations/material-sourcing/crm-contract/**'
      - 'frontend/material-sourcing-*.js'
      - 'frontend/apps/MaterialSourcing/**'
      - 'frontend/app.js'
      - 'frontend/tests/material-sourcing-*.test.mjs'
      - 'supabase/migrations/*mrh*'
      - 'sql/mrh-*.sql'
      - 'sql/tests/mrh-*.sql'
      - 'scripts/cp-ms-crm-04b2-fx-concurrency.sh'
      - 'scripts/cp-ms-crm-04b3-pricing-concurrency.sh'
      - '.github/workflows/cp-ms-crm-02-contract.yml'
  push:
    branches: [main, integration/cp-ms-crm-02, integration/cp-ms-crm-04b1, integration/cp-ms-crm-04b2, integration/cp-ms-crm-04b3, integration/cp-ms-crm-04b4, integration/cp-ms-crm-04b5]
    paths:
      - 'integrations/material-sourcing/crm-contract/**'
      - 'frontend/material-sourcing-*.js'
      - 'frontend/apps/MaterialSourcing/**'
      - 'frontend/app.js'
      - 'frontend/tests/material-sourcing-*.test.mjs'
      - 'supabase/migrations/*mrh*'
      - 'sql/mrh-*.sql'
      - 'sql/tests/mrh-*.sql'
      - 'scripts/cp-ms-crm-04b2-fx-concurrency.sh'
      - 'scripts/cp-ms-crm-04b3-pricing-concurrency.sh'
      - '.github/workflows/cp-ms-crm-02-contract.yml'
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Field and identity mapping plus existing CRM tests
        run: |
          node --test integrations/material-sourcing/crm-contract/reconcile.test.mjs frontend/tests/material-sourcing-*.test.mjs
      - name: Disposable PostgreSQL — existing MRH contracts
        run: |
          set -eu
          run_contract() {
            name="ms-crm02-$1"
            fixture="$2"
            candidate="$3"
            destination="$4"
            docker run --rm -d --name "$name" -e POSTGRES_PASSWORD=disposable_only postgres@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f >/dev/null
            for i in $(seq 1 60); do
              if docker exec "$name" pg_isready -U postgres >/dev/null 2>&1; then break; fi
              sleep 1
            done
            docker exec "$name" pg_isready -U postgres
            docker cp "$candidate" "$name:$destination"
            docker exec -i "$name" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 < "$fixture"
            docker stop "$name" >/dev/null
          }
          run_contract atomic sql/tests/mrh-atomic-material-disposable.sql supabase/migrations/20261110173953_mrh_material_atomic_create_20261111.sql /tmp/mrh-atomic.sql
          run_contract tasks sql/tests/mrh-board-item-tasks-disposable.sql sql/mrh-board-item-tasks-CANDIDATE-NOT-APPLIED.sql /tmp/mrh-task-candidate.sql
          run_contract viewer sql/tests/mrh-sourcing-board-viewer-disposable.sql sql/mrh-sourcing-board-viewer-commercial-read-CANDIDATE-NOT-APPLIED.sql /tmp/mrh-board-viewer-candidate.sql
      - name: Disposable PostgreSQL — exact pricing compatibility
        run: |
          set -eu
          name=ms-crm02-pricing
          docker run --rm -d --name "$name" -e POSTGRES_PASSWORD=disposable_only postgres@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f >/dev/null
          for i in $(seq 1 60); do
            if docker exec "$name" pg_isready -U postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec "$name" pg_isready -U postgres
          for f in integrations/material-sourcing/supabase/migrations/*.sql integrations/material-sourcing/supabase/seed.sql integrations/material-sourcing/crm-contract/pricing-contract.sql; do
            docker exec -i "$name" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 < "$f"
          done
          docker cp sql/mrh-pricing-v1-CANDIDATE-NOT-APPLIED.sql "$name:/tmp/mrh-pricing-v1.sql"
          docker exec -i "$name" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 < sql/tests/mrh-pricing-v1-disposable.sql
          docker cp sql/mrh-fx-snapshots-CANDIDATE-NOT-APPLIED.sql "$name:/tmp/mrh-fx-snapshots.sql"
          docker exec -i "$name" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 < sql/tests/mrh-fx-snapshots-disposable.sql
          bash scripts/cp-ms-crm-04b2-fx-concurrency.sh "$name"
          docker cp sql/mrh-pricing-persistence-CANDIDATE-NOT-APPLIED.sql "$name:/tmp/mrh-pricing-persistence.sql"
          docker exec -i "$name" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 < sql/tests/mrh-pricing-persistence-disposable.sql
          bash scripts/cp-ms-crm-04b3-pricing-concurrency.sh "$name"
          docker cp sql/mrh-atomic-material-edit-CANDIDATE-NOT-APPLIED.sql "$name:/tmp/mrh-atomic-edit.sql"
          docker cp sql/mrh-pricing-interface-CANDIDATE-NOT-APPLIED.sql "$name:/tmp/mrh-pricing-interface.sql"
          docker exec -i "$name" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 < sql/tests/mrh-pricing-interface-disposable.sql
          docker cp "$name:/tmp/mrh-pricing-preview-oracle.jsonl" /tmp/mrh-pricing-preview-oracle.jsonl
          MRH_PRICING_ORACLE=/tmp/mrh-pricing-preview-oracle.jsonl node --test frontend/tests/material-sourcing-pricing-panel.test.mjs
          docker cp sql/mrh-fx-acquisition-CANDIDATE-NOT-APPLIED.sql "$name:/tmp/mrh-fx-acquisition.sql"
          docker exec -i "$name" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 < sql/tests/mrh-fx-acquisition-disposable.sql
          # Only B.5 integration branch/PR requires live public-provider evidence.
          # Ordinary CRM regression stays deterministic and independent of provider uptime.
          if [ "$GITHUB_REF" = "refs/heads/integration/cp-ms-crm-04b5" ] || [ "${GITHUB_HEAD_REF:-}" = "integration/cp-ms-crm-04b5" ]; then
            curl --fail --silent --show-error --max-time 8 --proto '=https' 'https://api.frankfurter.dev/v2/rate/USD/PHP?providers=ECB' -o /tmp/mrh-live-usd.json
            curl --fail --silent --show-error --max-time 8 --proto '=https' 'https://api.frankfurter.dev/v2/rate/EUR/PHP?providers=ECB' -o /tmp/mrh-live-eur.json
            docker cp /tmp/mrh-live-usd.json "$name:/tmp/mrh-live-usd.json"
            docker cp /tmp/mrh-live-eur.json "$name:/tmp/mrh-live-eur.json"
            docker exec "$name" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c "select private.mrh_fx_provider_pair(pg_read_file('/tmp/mrh-live-usd.json'),pg_read_file('/tmp/mrh-live-eur.json'),clock_timestamp()) as live_provider_pair"
            echo CP_MS_CRM_04B5_LIVE_PROVIDER_PAIR_PASS
          fi
          docker stop "$name" >/dev/null
      - name: Clean disposable containers
        if: always()
        run: |
          for suffix in atomic tasks viewer pricing; do docker rm -f "ms-crm02-$suffix" >/dev/null 2>&1 || true; done
