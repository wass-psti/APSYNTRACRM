name: CP-FRT-NATIVE-01 Fund Tracker Integration
on:
  pull_request:
    paths:
      - "index.html"
      - "frontend/app.js"
      - "frontend/fund-tracker-*.js"
      - "frontend/fund-tracker-application.css"
      - "frontend/apsyntra-styles.bundle.css"
      - "frontend/sidebar-visuals.js"
      - "frontend/tests/fund-tracker-application.test.mjs"
      - "frontend/tests/frt-finance-readonly.test.mjs"
      - "frontend/tests/frt-sec14-signed-acceptance.test.mjs"
      - "frontend/tests/global-search.test.mjs"
      - "scripts/priority5-style-manifest.mjs"
      - "scripts/build-priority5-styles.mjs"
      - "scripts/pages-smoke.mjs"
      - "scripts/fund-tracker-native-browser-acceptance.mjs"
      - "docs/CP-FRT-NATIVE-01-FUND-TRACKER-INTEGRATION.md"
      - ".github/workflows/cp-frt-native-01.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    name: Fund Tracker contract, full frontend regression and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check application module syntax
        run: |
          node --check frontend/app.js
          for source in frontend/fund-tracker-*.js; do node --check "$source"; done
          node --check frontend/sidebar-visuals.js
          node --check scripts/fund-tracker-native-browser-acceptance.mjs
      - name: Verify generated stylesheet matches the ordered manifest
        run: node scripts/build-priority5-styles.mjs --check
      - name: Run complete frontend unit and contract regression suite
        run: npm test
      - name: Install Chromium for native renderer browser acceptance
        run: npx playwright install --with-deps chromium
      - name: Verify Fund Tracker native renderer and responsive layout in Chromium
        run: node scripts/fund-tracker-native-browser-acceptance.mjs
      - name: Build GitHub Pages production assets
        run: npm run build
