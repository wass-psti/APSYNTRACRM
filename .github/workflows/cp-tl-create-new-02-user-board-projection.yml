  contents: read

jobs:
  user-draft-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - name: Disposable PostgreSQL 17 signed User acceptance
        run: bash scripts/cp-tl-create-new-02-user-draft-disposable.sh
      - name: TradeLink User Board projection and shared document visibility contracts
        run: node --test frontend/tests/tradelink-user-board-projection-create.test.mjs frontend/tests/tradelink-shared-document-visibility.test.mjs
      - name: Migration source manifest
        run: node scripts/verify-migration-source-manifest.mjs
