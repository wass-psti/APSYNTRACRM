name: CP-CRM-WORKSPACE-INVITE Existing SMTP Transport
on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/ws02d-smtp.mjs'
      - 'supabase/functions/_shared/ws02d-trusted.ts'
      - 'server/tests/ws02d-smtp-provider.test.mjs'
      - 'docs/CP-CRM-WORKSPACE-INVITE-SMTP.md'
      - '.github/workflows/cp-crm-workspace-invite-smtp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  existing-smtp-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify unchanged migration source inventory
        run: node scripts/verify-migration-source-manifest.mjs
      - name: Verify SMTP adapter, signed invitation, idempotency and existing Resend fallback
        run: node --test server/tests/ws02d-*.test.mjs frontend/tests/workspace-invitation*.test.mjs
