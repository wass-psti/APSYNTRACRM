name: CP-WS-01B Disposable Workspace Lifecycle Acceptance
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cp-ws01b-disposable-postgres.yml'
      - 'sql/cp-ws01-discovery-activation-candidate.sql'
      - 'sql/cp-ws01b-*.sql'
      - 'sql/cp-ws01c-*.sql'
      - 'sql/cp-ws02*.sql'
      - 'sql/tests/cp-ws01b-*.sql'
      - 'sql/tests/cp-ws01c-*.sql'
      - 'sql/tests/cp-ws02*.sql'
      - 'frontend/workspace-ui.js'
      - 'frontend/workspace-lifecycle-client.js'
      - 'frontend/workspace-b2-signed-acceptance.js'
      - 'frontend/tests/workspace-ui.test.mjs'
      - 'frontend/tests/workspace-lifecycle-client.test.mjs'
      - 'frontend/tests/workspace-b2-signed-acceptance.test.mjs'
      - 'frontend/workspace-b3-signed-read-preflight.js'
      - 'frontend/tests/workspace-b3-signed-read-preflight.test.mjs'
      - 'scripts/ws02d-b3-*'
      - 'server/ws02d-*.mjs'
      - 'server/tests/ws02d-*.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace-contracts:
    name: Isolated session, privacy, idempotency and workspace denial (PG17)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_ws01_ci_only
          POSTGRES_DB: workspace_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d workspace_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: workspace_disposable
      PGUSER: postgres
      PGPASSWORD: disposable_ws01_ci_only
      PGCONNECT_TIMEOUT: '5'
      PGOPTIONS: '-c statement_timeout=30000'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install PostgreSQL client in disposable runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Verify isolated PostgreSQL 17 environment
        run: |
          set -euo pipefail
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = workspace_disposable
          psql -X -v ON_ERROR_STOP=1 -Atqc "SELECT current_database(), current_setting('server_version_num')::integer >= 170000" | grep -Fx 'workspace_disposable|t'
      - name: Run workspace UI and staged-contract regression tests
        run: node --test frontend/tests/workspace-ui.test.mjs frontend/tests/workspace-lifecycle-client.test.mjs frontend/tests/workspace-b2-signed-acceptance.test.mjs frontend/tests/workspace-b3-signed-read-preflight.test.mjs
      - name: Verify backend-only invitation, authenticated HTTP boundary and provider mocks
        run: node --test server/tests/ws02d-trusted-delivery.test.mjs server/tests/ws02d-resend-transport.test.mjs server/tests/ws02d-invitation-http-boundary.test.mjs
      - name: Install synthetic users, sessions and workspace fixture
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-ws01b-disposable-setup.sql
      - name: Install private B1-only schema (no lifecycle RPCs)
        run: psql -X -v ON_ERROR_STOP=1 -f sql/cp-ws01b-lifecycle-contract-candidate.sql
      - name: Verify isolated B1 schema, zero RPCs, disabled flags
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-ws01c-b1-schema-acceptance.sql
      - name: Install signed member discovery contract
        run: psql -X -v ON_ERROR_STOP=1 -f sql/cp-ws01-discovery-activation-candidate.sql
      - name: Verify B2-only authenticated discovery and anon denial
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-ws01c-b2-readonly-acceptance.sql
      - name: Verify B2-only synthetic cross-identity, foreign, revoked and expired denial
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-ws01c-b2-cross-identity-denial-disposable.sql
      - name: Verify B3 production-safe schema preactivation gate (no writes)
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -At -f sql/tests/cp-ws01c-b3-production-readonly-preflight.sql |
            grep -F 'B3_PREACTIVATION_SCHEMA_READY__ROLE_CEILING_AND_PRODUCTION_APPROVAL_PENDING'
      - name: Stage dormant B3 creation RPC (no authenticated write grants)
        run: psql -X -v ON_ERROR_STOP=1 -f sql/cp-ws01c-b3-create-contract-candidate.sql
      - name: Verify B3-only atomic creation, idempotency and rollback without B4
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-ws01c-b3-disposable-isolated-acceptance.sql
      - name: Stage private new-account Main Workspace provisioning without signup trigger
        run: psql -X -v ON_ERROR_STOP=1 -f sql/cp-ws02b-main-provisioning-candidate.sql
      - name: Verify one Main per new verified account, no legacy backfill, rollback
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-ws02b-disposable-provisioning-acceptance.sql
      - name: Simulate legacy signup triggers on disposable synthetic accounts
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-ws02b-disposable-legacy-auth-fixture.sql
      - name: Stage approved-policy signup trigger replacement (disposable only)
        run: psql -X -v ON_ERROR_STOP=1 -f sql/cp-ws02b-self-service-auth-trigger-candidate.sql
      - name: Verify confirmed Main provisioning, legacy preservation and no email admin promotion
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-ws02b-disposable-auth-trigger-acceptance.sql
      - name: Stage dormant private workspace invitation schema
        run: psql -X -v ON_ERROR_STOP=1 -f sql/cp-ws02d-invitation-schema-candidate.sql
      - name: Verify default-off invitation role, token and RLS constraints
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-ws02d-disposable-schema-acceptance.sql
      - name: Stage private signed invitation issuance (no client grants)
        run: psql -X -v ON_ERROR_STOP=1 -f sql/cp-ws02d-invitation-issue-candidate.sql
      - name: Stage private verified-recipient one-time acceptance
        run: psql -X -v ON_ERROR_STOP=1 -f sql/cp-ws02d-invitation-accept-candidate.sql
      - name: Stage private owner-authorized invitation revocation
        run: psql -X -v ON_ERROR_STOP=1 -f sql/cp-ws02d-invitation-revoke-candidate.sql
      - name: Verify invitation issue, email binding, replay and atomic acceptance
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-ws02d-disposable-issue-accept.sql
      - name: Verify denied foreign send, revoked tokens and expired sessions
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-ws02d-disposable-revoke-denial.sql
      - name: Verify bounded invitation sends, recipient quota and retry suppression
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-ws02d-disposable-rate-limits.sql
      - name: Stage private default-deny provider receipt and audit contract
        run: psql -X -v ON_ERROR_STOP=1 -f sql/cp-ws02d-b3-delivery-receipt-candidate.sql
      - name: Verify provider accepted, uncertain, replay, foreign actor and expired session
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-ws02d-b3-delivery-receipt-acceptance.sql
      - name: Stage private additive workspace permission ceiling
        run: psql -X -v ON_ERROR_STOP=1 -f sql/cp-ws02d-permission-ceiling-candidate.sql
      - name: Verify viewer-write denial, admin gating and workspace scope
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-ws02d-disposable-role-ceiling.sql
      - name: Install inactive workspace-selection cutover
        run: psql -X -v ON_ERROR_STOP=1 -f sql/cp-ws01b-session-cutover-candidate.sql
      - name: Verify default-deny grants and preactivation signed reads
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-ws01b-disposable-preactivation.sql
      - name: Accept disposable owner creation, privacy, CAS, revocation and isolation
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-ws01b-disposable-acceptance.sql
      - name: Reproduce deployed board ACL in synthetic workspace fixture
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-ws02d-b2-board-acl-fixture.sql
      - name: Stage minimal AND-integrated board role ceiling (disposable only)
        run: psql -X -v ON_ERROR_STOP=1 -f sql/cp-ws02d-b2-board-acl-integration-candidate.sql
      - name: Prove platform ceiling, Viewer denial, resource ACL and revoked-session integration
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-ws02d-b2-board-acl-integration-acceptance.sql
      - name: Reproduce existing standard and configured board creation functions
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-ws02d-b2-board-create-fixture.sql
      - name: Stage signed edit ceiling for both board creation functions
        run: psql -X -v ON_ERROR_STOP=1 -f sql/cp-ws02d-b2-board-create-ceiling-candidate.sql
      - name: Verify Member/Admin creation, Viewer denial, scope, audit and rollback
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-ws02d-b2-board-create-acceptance.sql
      - name: Reproduce four shared module state and lock mutation contracts
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-ws02d-b3-module-mutation-fixture.sql
      - name: Stage edit ceiling for module state and operation locks
        run: psql -X -v ON_ERROR_STOP=1 -f sql/cp-ws02d-b3-shared-module-mutation-ceiling-candidate.sql
      - name: Verify Member CAS/lock, Viewer denial, revoked session and isolated rollback
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-ws02d-b3-module-mutation-acceptance.sql
      - name: Reproduce FuelTrack Admin import with synthetic domain-role and activity dependencies
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-ws02d-b3-fueltrack-import-fixture.sql
      - name: Stage workspace edit ceiling on FuelTrack privileged activity import
        run: psql -X -v ON_ERROR_STOP=1 -f sql/cp-ws02d-b3-fueltrack-import-ceiling-candidate.sql
      - name: Verify FuelTrack Admin role, Viewer write denial and import rollback
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-ws02d-b3-fueltrack-import-acceptance.sql
      - name: Verify independent domain RBAC AND workspace ceiling without real records
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-ws02d-b3-independent-domain-ceiling-disposable.sql
      - name: Validate all 24 remaining deployed domain source fingerprints and ceiling-only changes
        run: node scripts/ws02d-b3-source-check.mjs --check
      - name: Reproduce 24 remaining domain sources in disposable PG17
        run: |
          set -euo pipefail
          node scripts/ws02d-b3-source-check.mjs --emit-fixture > /tmp/ws02d-b3-original.sql
          psql -X -v ON_ERROR_STOP=1 -f /tmp/ws02d-b3-original.sql
      - name: Stage 24 remaining source-preserving edit and manage ceilings
        run: psql -X -v ON_ERROR_STOP=1 -f sql/cp-ws02d-b3-remaining-domain-ceiling-candidate.sql
      - name: Check Viewer edit, Member manage, signed expiry denial and rollback
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-ws02d-b3-remaining-domain-acceptance.sql
      - name: Exercise all 24 source-preserved entrypoints under Viewer, Member and expired session
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-ws02d-b3-all-24-entrypoint-denial.sql
      - name: Preserve allowed FuelTrack module-Admin import after aggregate 24-function ceiling
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-ws02d-b3-import-role-preservation.sql
      - name: Stage isolated TimeTracker domain authorization and GPS read test doubles
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-ws02d-b3-timetracker-positive-fixture.sql
      - name: Verify TimeTracker signed clock-in and clock-out, GPS, CAS, workspace and expiry denial
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-ws02d-b3-timetracker-valid-write-acceptance.sql
      - name: Stage synthetic Employee Evaluation domain schema, audit and role fixtures
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-ws02d-b3-employee-eval-positive-fixture.sql
      - name: Verify Employee Evaluation authorized transactions, CAS, review, scope and Viewer denial
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-ws02d-b3-employee-eval-valid-write-acceptance.sql
      - name: Stage synthetic Order Intake currency, financial, audit and idempotency schema
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-ws02d-b3-order-intake-positive-fixture.sql
      - name: Verify Order Intake authorized create/update/status/archive/restore and denied writes
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-ws02d-b3-order-intake-valid-write-acceptance.sql
      - name: Stage remaining FuelTrack activity and request-state test dependencies
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-ws02d-b3-fueltrack-two-positive-fixture.sql
      - name: Accept FuelTrack event append, atomic request CAS and signed authorization denials
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-ws02d-b3-fueltrack-two-valid-write.sql
      - name: Stage TradeLink asset and reconciliation verifier with synthetic storage
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-ws02d-b3-tradelink-positive-fixture.sql
      - name: Accept six TradeLink asset, reconciliation, fence and cleanup audit workflows
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-ws02d-b3-tradelink-six-valid-write.sql
      - name: Reproduce original bootstrap guard with synthetic roles and identities
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-ws02d-b3-admin-role-positive-fixture.sql
      - name: Accept Charter and application role grant, revision, revoke and denied actors
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-ws02d-b3-admin-two-valid-write.sql
      - name: Verify actual two-session advisory asset and FuelTrack request CAS races
        run: node scripts/ws02d-b3-disposable-concurrency.mjs
