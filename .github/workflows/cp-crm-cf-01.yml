name: CP-CRM-CF-01 Cloudflare preview validation
on:
  push:
    branches: [main]
    paths:
      - 'wrangler.jsonc'
      - 'scripts/package-cloudflare-assets.mjs'
      - 'scripts/deploy-cloudflare-preview.mjs'
      - 'scripts/verify-cloudflare-preview.sh'
      - '.github/workflows/cp-crm-cf-01.yml'
      - 'index.html'
      - '404.html'
      - 'service-worker.js'
      - 'frontend/**'
      - 'paseo/**'
  # Deployment follows the exact successful full CRM validation run, not a moving main ref.
  workflow_run:
    workflows: ["APSYNTRA CRM Frontend Validation"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      hosted_smoke:
        description: Verify the deployed preview against this commit (read-only)
        type: boolean
        default: false
      release_sha:
        description: Optional exact main-history commit for read-only hosted verification
        type: string
        default: ''
permissions:
  contents: read
jobs:
  static-preview:
    if: ${{ github.event_name != 'workflow_run' || (vars.CF_WATCHDOG_PREVIEW_AUTO_DEPLOY == 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.release_sha || github.sha }}
          fetch-depth: 0
      - name: Verify immutable revision belongs to main history
        env:
          REQUESTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.release_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify existing Pages source and package exact browser assets
        run: |
          node scripts/verify-pages-source.mjs
          node --check scripts/package-cloudflare-assets.mjs
          node scripts/package-cloudflare-assets.mjs
      - name: Validate isolated Worker configuration without uploading
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          node --check scripts/deploy-cloudflare-preview.mjs
          if WRANGLER_CI_OVERRIDE_NAME=apsyntracrm node scripts/deploy-cloudflare-preview.mjs --dry-run; then
            echo 'Unexpected acceptance of production target' >&2
            exit 1
          fi
          if CLOUDFLARE_ACCOUNT_ID=dcac8518b4a28968b37a6fbe678f3cbe node scripts/deploy-cloudflare-preview.mjs --dry-run; then
            echo 'Unexpected acceptance of previous account' >&2
            exit 1
          fi
          node scripts/deploy-cloudflare-preview.mjs --dry-run
      - name: Verify static HTTP behavior in local Workers runtime on CI
        env:
          WRANGLER_SEND_METRICS: 'false'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.166.0 dev --config wrangler.jsonc --local --ip 127.0.0.1 --port 8791 > /tmp/cf-preview.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat /tmp/cf-preview.log' EXIT
          base=http://127.0.0.1:8791
          for attempt in $(seq 1 45); do
            if curl -fsS "$base/APSYNTRACRM/" -o /tmp/cf-index; then break; fi
            sleep 2
          done
          bash scripts/verify-cloudflare-preview.sh "$base"
      - uses: actions/upload-artifact@v4
        with:
          name: apsyntracrm-cloudflare-preview
          path: .cloudflare-build/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
  hosted-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.hosted_smoke }}
    needs: static-preview
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.release_sha || github.sha }}
      - name: Compare hosted preview against this commit
        run: bash scripts/verify-cloudflare-preview.sh https://apsyntracrm-preview.watchdog-521.workers.dev
  deploy-preview:
    # Explicitly opt in only after provisioning the dedicated CI credential.
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main' && vars.CF_WATCHDOG_PREVIEW_AUTO_DEPLOY == 'true' }}
    needs: static-preview
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: apsyntracrm-cloudflare-preview
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.release_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release and migration manifest after full CRM CI
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"
          node scripts/verify-migration-source-manifest.mjs
      - uses: actions/download-artifact@v4
        with:
          name: apsyntracrm-cloudflare-preview
          path: .cloudflare-build/
      - name: Check exact revision is still current main
        id: current
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote origin refs/heads/main | cut -f1)"
          test -n "$current"
          if [ "$current" = "$(git rev-parse HEAD)" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Superseded commit; skipping deployment"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy only the validated preview artifact
        if: steps.current.outputs.deploy == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: 521910d64f92c18a0e6e3eb1b2e93c71
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WATCHDOG_PREVIEW_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          node scripts/deploy-cloudflare-preview.mjs
      - name: Verify actual hosted release
        if: steps.current.outputs.deploy == 'true'
        run: bash scripts/verify-cloudflare-preview.sh https://apsyntracrm-preview.watchdog-521.workers.dev
