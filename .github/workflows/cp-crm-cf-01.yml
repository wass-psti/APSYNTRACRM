name: CP-CRM-CF-01 Cloudflare preview validation
on:
  push:
    branches: [main]
    paths:
      - 'wrangler.preview.jsonc'
      - 'scripts/package-cloudflare-assets.mjs'
      - '.github/workflows/cp-crm-cf-01.yml'
      - 'index.html'
      - '404.html'
      - 'service-worker.js'
      - 'frontend/**'
      - 'paseo/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify existing Pages source and package exact browser assets
        run: |
          node scripts/verify-pages-source.mjs
          node --check scripts/package-cloudflare-assets.mjs
          node scripts/package-cloudflare-assets.mjs
      - name: Validate isolated Worker configuration without uploading
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.166.0 deploy --config wrangler.preview.jsonc --dry-run
      - name: Verify static HTTP behavior in local Workers runtime on CI
        env:
          WRANGLER_SEND_METRICS: 'false'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.166.0 dev --config wrangler.preview.jsonc --local --ip 127.0.0.1 --port 8791 > /tmp/cf-preview.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat /tmp/cf-preview.log' EXIT
          base=http://127.0.0.1:8791
          for attempt in $(seq 1 45); do
            if curl -fsS "$base/APSYNTRACRM/" -o /tmp/cf-index; then break; fi
            sleep 2
          done
          curl -fsS "$base/APSYNTRACRM/" -o /tmp/cf-index
          cmp index.html /tmp/cf-index
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/")" = 302
          test "$(curl -s -o /dev/null -w '%{redirect_url}' "$base/")" = "$base/APSYNTRACRM/"
          curl -fsS "$base/APSYNTRACRM/frontend/app.js" -o /tmp/cf-app
          cmp frontend/app.js /tmp/cf-app
          curl -fsS "$base/APSYNTRACRM/frontend/apsyntra-styles.bundle.css" -o /tmp/cf-css
          cmp frontend/apsyntra-styles.bundle.css /tmp/cf-css
          curl -fsS "$base/APSYNTRACRM/paseo/" -o /tmp/cf-paseo
          cmp paseo/index.html /tmp/cf-paseo
          test "$(curl -s -o /tmp/cf-404 -w '%{http_code}' "$base/APSYNTRACRM/paseo/courts")" = 404
          cmp paseo/404.html /tmp/cf-404
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/APSYNTRACRM/frontend/tests/not-a-runtime-asset.js")" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/APSYNTRACRM/supabase/config.toml")" = 404
      - uses: actions/upload-artifact@v4
        with:
          name: apsyntracrm-cloudflare-preview
          path: .cloudflare-build/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
