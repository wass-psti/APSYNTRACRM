name: CP-PDL-GUEST-EXPERIENCE-02
on:
  push:
    branches: [cp-pdl-guest-experience-02]
  pull_request:
    branches: [main]
    paths:
      - "frontend/apps/Paseo/source/**"
      - "supabase/pdl-booking/**"
      - "scripts/pdl-cp02-local-acceptance.sh"
      - ".github/workflows/cp-pdl-guest-experience-02.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cp-pdl-guest-experience-02-${{ github.ref }}
  cancel-in-progress: true
jobs:
  disposable-end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: frontend/apps/Paseo/source/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Install Paseo dependencies
        working-directory: frontend/apps/Paseo/source
        run: npm ci
      - name: Install Chromium
        working-directory: frontend/apps/Paseo/source
        run: npx playwright install --with-deps chromium
      - name: Run CP02 disposable end-to-end acceptance
        run: bash scripts/pdl-cp02-local-acceptance.sh
