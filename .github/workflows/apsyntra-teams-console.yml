name: APSYNTRA Teams Console Contract
on:
  pull_request:
    paths:
      - 'frontend/teams/**'
      - 'frontend/app.js'
      - 'frontend/tests/teams-console.test.mjs'
      - 'frontend/tests/team-board-invite.test.mjs'
      - 'frontend/board/collaboration/invite.js'
      - 'frontend/teams/team-board-invite.js'
      - 'sql/cp-teams-board-invite-CANDIDATE-NOT-APPLIED.sql'
      - 'scripts/teams-browser-acceptance.mjs'
      - 'index.html'
      - 'sql/cp-teams-role-management-CANDIDATE-NOT-APPLIED.sql'
      - '.github/workflows/apsyntra-teams-console.yml'
  workflow_dispatch:
jobs:
  teams-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check frontend/teams/teams-ui.js && node --check frontend/teams/teams-client.js && node --check frontend/teams/teams-controller.js && node --check frontend/app.js
      - run: node --test frontend/tests/teams-console.test.mjs frontend/tests/system-admin-role.test.mjs frontend/tests/team-board-invite.test.mjs frontend/tests/board-invite-header.test.mjs
      - run: npm run build
      - name: Verify layout in real Chromium
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN" || { echo 'Chromium not installed'; exit 1; }
          node scripts/teams-browser-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apsyntra-teams-layout-preview
          path: artifacts/teams-console/*.png
          if-no-files-found: ignore
