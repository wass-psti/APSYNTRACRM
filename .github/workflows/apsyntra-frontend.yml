        if: always()
        env:
          PGPASSWORD: disposable_only
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGDATABASE: postgres
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          createdb cp_tl_document_identity_order_01b
          PGDATABASE=cp_tl_document_identity_order_01b psql -X -v ON_ERROR_STOP=1 \
            -f sql/tests/cp-tl03-disposable-setup.sql \
