            -f sql/cp-frt-sec14-legacy-read-grant-retirement-candidate.sql \
            -f sql/tests/cp-frt-sec14-auto-foreign-ci-bootstrap.sql \
            -f sql/cp-frt-sec14-auto-foreign-denials.sql \
            -f sql/tests/cp-frt-sec14-auto-foreign-disposable.sql \
            -f sql/tests/cp-frt-sec14-auto-foreign-grant-drift.sql \
            -f supabase/migrations/20261113060749_cp_frt_ic_01_intercompany_ledger.sql \
            -f sql/tests/cp-frt-ic-01-disposable-acceptance.sql
      - name: Verify Main Workspace owner Admin scope and workspace email isolation
        env:
          PGPASSWORD: disposable_only
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
        run: |
          createdb main_workspace_owner_disposable
          PGDATABASE=main_workspace_owner_disposable psql -X -v ON_ERROR_STOP=1 \
            -f sql/tests/cp-main-workspace-owner-admin-setup.sql \
            -f supabase/migrations/20261113031952_main_workspace_owner_crm_admin_20261113.sql \
            -f sql/tests/cp-main-workspace-owner-admin-acceptance.sql
      - name: Verify FuelTrans two-identity persisted lifecycle with existing RLS contracts
        env:
          PGPASSWORD: disposable_only
