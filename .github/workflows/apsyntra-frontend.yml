jobs:
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked frontend dependencies (FM1 validation)
        run: npm ci --no-audit --no-fund
      - name: Verify GitHub Pages-only runtime and public credentials
        run: node scripts/verify-pages-source.mjs
      - name: Rebuild the pinned Supabase Auth browser module
        run: npm run build:auth-vendor
      - name: Check shipped JavaScript syntax
        run: |
          for source in frontend/*.js; do node --check "$source"; done
          node --check frontend/vendor/supabase-auth.js
          node --check frontend/auth/supabase-auth-entry.js
          node --check frontend/workspace-preference.js
          node --check scripts/build-supabase-auth-vendor.mjs
          node --check scripts/cp-ws-auth-continuity-browser.mjs
          node --check scripts/cp-board-col01-signed-http.mjs
          node --check frontend/fueltrans/station-evidence07.js
          node --check scripts/cp-ft-ui07-browser.mjs
          node --check scripts/cp-ft-ui07-real-browser.mjs
          node --check frontend/fueltrans/station-owner-review08.js
          node --check frontend/fueltrans/station-staging08.js
          node --check scripts/cp-ft-ui08-browser.mjs
          node --check frontend/fueltrans/station-import-plan09.js
          node --check scripts/cp-ft-ui09-station-import-dry-run.mjs
          node --check scripts/cp-ft-ui09-browser.mjs
      - name: Check main HTML entry point
        run: |
          test -f index.html
          test -f frontend/app.js
          test -f frontend/styles.css
          grep -q 'frontend/app.js' index.html
      - name: Block regression to broad FRT read RPCs in shipped first-party code
        run: node scripts/sec14-legacy-read-consumer-guard.mjs
      - name: Verify recovered production migration source manifest
        run: node scripts/verify-migration-source-manifest.mjs
      - name: Test authentication and existing backend contracts
        run: node --test frontend/tests/*.test.mjs


  disposable-postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify isolated PostgreSQL 17 migrations and effective role boundaries
        env:
          PGPASSWORD: disposable_only
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGDATABASE: postgres
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql -v ON_ERROR_STOP=1 \
            -f sql/tests/cp-frt-sec06-disposable-setup.sql \
            -f sql/cp-frt-sec06-crm-platform-role-cap.sql \
            -f sql/cp-frt-sec06-domain-role-ceiling.sql \
            -f sql/tests/cp-frt-sec06-disposable-acceptance.sql \
            -f sql/tests/cp-frt-sec10-disposable-session-transitions.sql \
            -f sql/cp-frt-sec11-signed-effective-access.sql \
            -f sql/tests/cp-frt-sec11-self-access-disposable.sql \
            -f sql/tests/cp-frt-sec10-ci03-native-finance.sql \
