            -f supabase/migrations/20261123080322_cp_tl_document_identity_order_01.sql \
            -f sql/tests/cp-tl-document-identity-order-01b-disposable.sql
      - name: Verify TradeLink All Documents bulk actions in disposable PostgreSQL 17
        if: always()
        env:
          PGPASSWORD: disposable_only
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: postgres
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
