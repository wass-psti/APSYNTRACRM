            -f sql/cp-frt-sec14-financial-analytics-safe.sql \
            -f sql/cp-frt-sec14-legacy-summary-list-cutover.sql \
            -f sql/tests/cp-frt-sec14-safe-board-disposable.sql \
            -f sql/tests/cp-frt-sec14-financial-analytics-disposable.sql \
            -f sql/cp-frt-board03-date-cas-CANDIDATE.sql \
            -f sql/tests/cp-frt-board03-date-cas-disposable.sql \
            -f sql/tests/cp-frt-board03b-disposable-profile-compat.sql \
            -f sql/cp-frt-board03b-person-assignment-CANDIDATE.sql \
            -f sql/tests/cp-frt-board03b-person-assignment-disposable.sql \
            -f sql/tests/cp-frt-board03c-signed-refresh-isolation-disposable.sql \
            -f sql/cp-frt-filing01-CANDIDATE.sql \
