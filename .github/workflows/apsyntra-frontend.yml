name: APSYNTRA CRM Frontend Validation
on:
  push:
    branches: [main, feature/cp-role-configuration-bootstrap, feature/cp-rc02-live-user-role-management, fix/form-field-identifiers]
    paths:
      - "index.html"
      - ".nojekyll"
      - "scripts/verify-pages-source.mjs"
      - "scripts/pages-smoke.mjs"
      - "docs/PAGES-OPERATIONS.md"
      - "frontend/**"
      - "sql/cp-role-configuration-bootstrap.sql"
      - "docs/CP-ROLE-CONFIGURATION.md"
      - ".github/workflows/apsyntra-frontend.yml"
  workflow_dispatch:
jobs:
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify GitHub Pages-only runtime and public credentials
        run: node scripts/verify-pages-source.mjs
      - name: Check shipped JavaScript syntax
        run: |
          for source in frontend/*.js; do node --check "$source"; done
      - name: Check main HTML entry point
        run: |
          test -f index.html
          test -f frontend/app.js
          test -f frontend/styles.css
          grep -q 'frontend/app.js' index.html
      - name: Test authentication and existing backend contracts
        run: node --test frontend/tests/*.test.mjs

  live-pages:
    needs: frontend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify live GitHub Pages assets match this main commit
        env:
          EXPECTED_DEPLOY_SHA: ${{ github.sha }}
        run: node scripts/pages-smoke.mjs
