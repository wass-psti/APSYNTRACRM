name: APSYNTRA CRM Frontend Validation
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

on:
  push:
    branches: [main, feature/cp-role-configuration-bootstrap, feature/cp-rc02-live-user-role-management, fix/form-field-identifiers, security/cp-frt-sec03-frontend-signed-acceptance, feature/cp-frt-sec04-signed-ui-acceptance, feature/cp-frt-sec06-crm-platform-rbac, fix/cp-frt-sec06-rpc-rollout-compatibility, feature/cp-frt-sec07-signed-activation-gate, feature/cp-frt-sec09-signed-authorization-acceptance, feature/cp-frt-sec10-transition-revocation-acceptance, fix/cp-frt-sec10-session-eligibility-feedback, feat/fueltrack-backend-core-20261109, fix/cp-frt-sec11-signed-effective-permissions, fix/cp-frt-sec11-board-refresh-reconcile, fix/annotate-temporary-csp-styles, feature/cp-frt-sec10-nonprod-live-acceptance, feat/cp-ft3-functional-closure-20261111, fix/cp-ft3-idempotent-receipt-retry-20261111, fix/board-import-valid-xlsx-compression-20261111, fix/board-import-monday-zip64-entry-metadata-20261111, fix/board-import-uncached-formula-cells-20261111, fix/cp-bimp-04-import-flow-20261111, fix/cp-bimp-05-item-remap-explicit-skip-20261111, fix/board-import-utc-timestamp-values-20261111, fix/board-import-date-normalizer-cache-bust-20261111, fix/board-import-long-description-inference-20261111, fix/cp-bimp-06-invalid-token-import-recovery-20261111, feat/cp-bimp-11-existing-board-compatibility-20261111, feat/cp-bimp-12-cross-config-20261111, feat/cp-bimp-13-bounded-import-20261112, feat/cp-bimp-14-recoverable-20261112, feat/cp-bimp-15-durable-20261112, release/cp-bimp-16-integrated-20261112, feat/cp-bimp-17-existing-config-diagnostics-20261112]
    paths:
      - "index.html"
      - ".nojekyll"
      - "scripts/verify-pages-source.mjs"
      - "scripts/cp-frt-sec10-*.mjs"
      - "scripts/cp-board-col01-*.mjs"
      - "docs/CP-FRT-SEC10-ISOLATED-LIVE-ACCEPTANCE.md"
      - "scripts/pages-smoke.mjs"
      - "scripts/pages-smoke-supersession.mjs"
      - "scripts/sec14-legacy-read-consumer-guard.mjs"
      - "docs/CP-FRT-SEC14-LEGACY-RPC-CONSUMER-COMPATIBILITY.md"
      - "docs/PAGES-OPERATIONS.md"
      - "frontend/**"
      - "docs/BIMP-01-CSV-XLSX-IMPORT.md"
      - "docs/CP-BIMP-11-EXISTING-BOARD-COMPATIBILITY.md"
      - "docs/CP-BIMP-12-FINDINGS-CROSS-CONFIG-ACCEPTANCE.md"
      - "docs/CP-BIMP-13-BOUNDED-IMPORT-ACCEPTANCE.md"
      - "docs/CP-BIMP-14-RECOVERABLE-EXTENDED-ACCEPTANCE.md"
      - "docs/CP-BIMP-15A-DURABLE-RECOVERY-ACCEPTANCE.md"
      - "docs/CP-BIMP-16-SIGNED-RELEASE-ACCEPTANCE.md"
      - "docs/CP-BIMP-17-IMPORT-COMPATIBILITY-AND-ACTIVATION-READINESS.md"
      - "sql/cp-board-collab01-*.sql"
      - "sql/tests/cp-board-collab01-*.sql"
      - "sql/cp-frt-sec06-*.sql"
      - "sql/tests/cp-frt-sec06-*.sql"
      - "sql/tests/cp-frt-sec07-*.sql"
      - "sql/tests/cp-frt-sec10-*.sql"
      - "sql/cp-frt-sec11-*.sql"
      - "sql/tests/cp-frt-sec11-*.sql"
      - "sql/cp-frt-sec14-*.sql"
      - "sql/tests/cp-frt-sec14-*.sql"
      - "sql/cp-tt-ot01-*.sql"
      - "sql/tests/cp-tt-ot02-*.sql"
      - "sql/cp-tt-monitor01-*.sql"
      - "sql/cp-tt-gps02-*.sql"
      - "sql/cp-tt-gps03-*.sql"
      - "sql/cp-tt-gps04-*.sql"
      - "sql/tests/cp-tt-gps04-*.sql"
      - "sql/tests/cp-tt-gps02-*.sql"
      - "sql/tests/cp-tt-gps03-*.sql"
      - "sql/cp-tt-live01-*.sql"
      - "sql/tests/cp-tt-live01-*.sql"
      - "sql/tests/cp-tt-monitor01-*.sql"
      - "docs/CP-FRT-SEC11-SIGNED-EFFECTIVE-ACCESS.md"
      - "docs/CP-FRT-SEC10-CONTROLLED-TRANSITIONS.md"
      - "docs/CP-FRT-SEC07-CONTROLLED-ACTIVATION.md"
      - "docs/CP-FRT-SEC09-SIGNED-AUTHORIZATION-ACCEPTANCE.md"
      - "docs/CP-FRT-SEC06-CRM-PLATFORM-RBAC.md"
      - "sql/cp-role-configuration-bootstrap.sql"
      - "docs/CP-ROLE-CONFIGURATION.md"
      - ".github/workflows/apsyntra-frontend.yml"
  workflow_dispatch:
jobs:
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify GitHub Pages-only runtime and public credentials
        run: node scripts/verify-pages-source.mjs
      - name: Check shipped JavaScript syntax
        run: |
          for source in frontend/*.js; do node --check "$source"; done
          node --check scripts/cp-board-col01-signed-http.mjs
      - name: Check main HTML entry point
        run: |
          test -f index.html
          test -f frontend/app.js
          test -f frontend/styles.css
          grep -q 'frontend/app.js' index.html
      - name: Block regression to broad FRT read RPCs in shipped first-party code
        run: node scripts/sec14-legacy-read-consumer-guard.mjs
      - name: Test authentication and existing backend contracts
        run: node --test frontend/tests/*.test.mjs


  disposable-postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify isolated PostgreSQL 17 migrations and effective role boundaries
        env:
          PGPASSWORD: disposable_only
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGDATABASE: postgres
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql -v ON_ERROR_STOP=1 \
            -f sql/tests/cp-frt-sec06-disposable-setup.sql \
            -f sql/cp-frt-sec06-crm-platform-role-cap.sql \
            -f sql/cp-frt-sec06-domain-role-ceiling.sql \
            -f sql/tests/cp-frt-sec06-disposable-acceptance.sql \
            -f sql/tests/cp-frt-sec10-disposable-session-transitions.sql \
            -f sql/cp-frt-sec11-signed-effective-access.sql \
            -f sql/tests/cp-frt-sec11-self-access-disposable.sql \
            -f sql/tests/cp-frt-sec10-ci03-native-finance.sql \
            -f sql/tests/cp-frt-sec14-canonical-preflight-fixture.sql \
            -f sql/cp-frt-sec14-production-additive-read-activation.sql \
            -f sql/tests/cp-frt-sec14-production-additive-disposable.sql \
            -f sql/cp-frt-sec14-restricted-details-action-access.sql \
            -f sql/cp-frt-sec14-board-safe-read-contracts.sql \
            -f sql/cp-frt-sec14-legacy-summary-list-cutover.sql \
            -f sql/tests/cp-frt-sec14-safe-board-disposable.sql \
            -f sql/tests/cp-frt-sec14-retirement-disposable-preflight.sql \
            -f sql/cp-frt-sec14-legacy-read-grant-retirement-candidate.sql \
            -f sql/cp-frt-sec14-legacy-read-grant-retirement-candidate.sql \
            -f sql/tests/cp-frt-sec14-auto-foreign-ci-bootstrap.sql \
            -f sql/cp-frt-sec14-auto-foreign-denials.sql \
            -f sql/tests/cp-frt-sec14-auto-foreign-disposable.sql \
            -f sql/tests/cp-frt-sec14-auto-foreign-grant-drift.sql
  disposable-collaboration-postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify isolated board collaboration authorization candidate
        env:
          PGPASSWORD: disposable_only
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGDATABASE: postgres
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql -v ON_ERROR_STOP=1 \
            -f sql/tests/cp-board-collab01-disposable-setup.sql \
            -f sql/cp-board-collab01-authorization-candidate.sql \
            -f sql/tests/cp-board-collab01-disposable-acceptance.sql \
            -f sql/tests/cp-board-collab01-revocation-acceptance.sql \
            -f sql/cp-board-collab01-rollback.sql \
            -f sql/tests/cp-board-collab01-rollback-acceptance.sql

  disposable-ot-postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify signed OT permissions in disposable PostgreSQL 17
        env:
          PGPASSWORD: disposable_only
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGDATABASE: postgres
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql -v ON_ERROR_STOP=1 \
            -f sql/tests/cp-tt-ot02-disposable-setup.sql \
            -f sql/cp-tt-ot01-staged-bootstrap-approval.sql \
            -f sql/tests/cp-tt-ot02-disposable-acceptance.sql \
            -f sql/cp-tt-monitor01-staged-health.sql \
            -f sql/tests/cp-tt-monitor01-disposable-acceptance.sql \
            -f sql/cp-tt-gps02-server-read-redaction.sql \
            -f sql/tests/cp-tt-gps02-disposable-redaction.sql \
            -f sql/tests/cp-tt-gps03-disposable-setup.sql \
            -f sql/cp-tt-gps03-remaining-read-path-redaction.sql \
            -f sql/tests/cp-tt-gps03-disposable-acceptance.sql \
            -f sql/tests/cp-tt-live01-disposable-setup.sql \
            -f sql/cp-tt-live01-staged-atomic-attendance.sql \
            -f sql/tests/cp-tt-live01-disposable-acceptance.sql \
            -f sql/cp-tt-gps04-fix-privileged-snapshot-cte.sql \
            -f sql/tests/cp-tt-gps04-disposable-acceptance.sql
  live-pages:
    needs: [frontend, disposable-ot-postgres, disposable-collaboration-postgres]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify live GitHub Pages assets match this main commit
        env:
          EXPECTED_DEPLOY_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/pages-smoke.mjs
