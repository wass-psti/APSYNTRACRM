name: CP-TL-GM-04C AR Migration Package
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cp-tl-gm-04c-ar-package.yml'
      - 'sql/candidates/cp-tl-gm-04c-ar-production-preflight.sql'
      - 'sql/candidates/cp-tl-gm-04a-ar-reconciliation.sql'
      - 'sql/tests/cp-tl-gm-04a-ar-disposable.sql'
      - 'sql/candidates/cp-tl-gm-04c-ar-rollback.sql'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: tradelink_ar_disposable
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d tradelink_ar_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: tradelink_ar_disposable
      PGUSER: postgres
      PGPASSWORD: disposable_ci_only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Generate versioned SQL with Supabase CLI
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ar-package/supabase/migrations"
          cd "$RUNNER_TEMP/ar-package"
          npx --yes supabase@2.121.0 --version
          npx --yes supabase@2.121.0 migration new --help
          npx --yes supabase@2.121.0 migration new cp_tl_gm_ar_reconciliation
          migration=$(find supabase/migrations -name '*_cp_tl_gm_ar_reconciliation.sql' -type f)
          test -n "$migration"
          cp "$GITHUB_WORKSPACE/sql/candidates/cp-tl-gm-04a-ar-reconciliation.sql" "$migration"
          cp "$GITHUB_WORKSPACE/sql/candidates/cp-tl-gm-04c-ar-production-preflight.sql" .
          cp "$GITHUB_WORKSPACE/sql/candidates/cp-tl-gm-04c-ar-rollback.sql" .
          sha256sum "$migration" *.sql
          echo "Generated migration: $migration"
          echo "AR_MIGRATION=$RUNNER_TEMP/ar-package/$migration" >> "$GITHUB_ENV"
      - name: Rehearse exact packaged migration and rollback
        run: |
          set -euo pipefail
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = tradelink_ar_disposable
          cmp "$AR_MIGRATION" 'sql/candidates/cp-tl-gm-04a-ar-reconciliation.sql'
          cp "$AR_MIGRATION" 'sql/candidates/cp-tl-gm-04a-ar-reconciliation.sql'
          node --test frontend/tests/tradelink-cheque-clearance.test.mjs
          psql -X -v ON_ERROR_STOP=1 -f 'sql/tests/cp-tl-gm-04a-ar-disposable.sql'
      - name: Upload activation package (no production deployment)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tradelink-ar-activation-package
          path: ${{ runner.temp }}/ar-package/
