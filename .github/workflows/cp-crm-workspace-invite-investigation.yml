name: CP-CRM-WORKSPACE-INVITE Investigation and Readiness
on:
  pull_request:
    paths:
      - 'frontend/tests/cp-crm-workspace-invite-preflight.test.mjs'
      - 'docs/CP-CRM-WORKSPACE-INVITE-INVESTIGATION-20261120.md'
      - '.github/workflows/cp-crm-workspace-invite-investigation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-investigation-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify migration source integrity
        run: node scripts/verify-migration-source-manifest.mjs
      - name: Verify invitation preflight and client lifecycle safeguards
        run: node --test frontend/tests/cp-crm-workspace-invite-preflight.test.mjs frontend/tests/workspace-invitation-client.test.mjs frontend/tests/workspace-invitation-acceptance.test.mjs frontend/tests/ws11-invitation-management.test.mjs frontend/tests/resource-email-invitations.test.mjs
