name: CP-CRM Workspace Invite — Bootstrap Sender Parity Candidate
on:
  pull_request:
    paths:
      - 'sql/activation/cp-crm-workspace-invite-bootstrap-sender-parity-CANDIDATE-NOT-APPLIED.sql'
      - 'server/tests/ws02d-bootstrap-sender-parity-candidate.test.mjs'
      - 'docs/CP-CRM-WORKSPACE-INVITE-BACKEND-02.md'
      - '.github/workflows/cp-crm-workspace-invite-bootstrap-sender.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap-invite-sender-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify invitation contracts including protected bootstrap sender parity
        run: node --test server/tests/ws02d-*.test.mjs frontend/tests/workspace-invitation*.test.mjs
      - name: Verify source migration inventory remains unchanged
        run: node scripts/verify-migration-source-manifest.mjs
