name: APSYNTRA Pages Post-Deployment Acceptance
on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pages-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate frontend source and security boundary
        run: node scripts/verify-pages-source.mjs
      - name: Verify LIVE deployed HTML, JS, CSS and Supabase health
        env:
          EXPECTED_DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/pages-smoke.mjs
