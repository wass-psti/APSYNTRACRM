name: CP-CRM-NATIVE-04B3 Existing Finance Capability Contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cp-crm-native04b3-finance-capability.yml'
      - 'sql/tests/cp-crm-native04b3-finance-capability-readonly.sql'
      - 'frontend/tests/cp-crm-native04b3-finance-capability.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/cp-crm-native04b3-finance-capability.yml'
      - 'sql/tests/cp-crm-native04b3-finance-capability-readonly.sql'
      - 'frontend/tests/cp-crm-native04b3-finance-capability.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native04b3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  finance-capability:
    name: FRT existing-role workflow and no-write audit contract
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify existing finance capabilities without contacting production
        run: |
          set -euo pipefail
          test -z "${SUPABASE_DB_URL:-}"
          test -z "${DATABASE_URL:-}"
          node --test frontend/tests/cp-crm-native04b3-finance-capability.test.mjs
          npx eslint frontend/tests/cp-crm-native04b3-finance-capability.test.mjs
      - name: Full frontend regression
        run: npm test
