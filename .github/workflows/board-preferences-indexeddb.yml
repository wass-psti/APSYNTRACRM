name: APSYNTRA Selective IndexedDB Preference Acceptance
on:
  pull_request:
    paths:
      - 'frontend/board-preferences-idb.js'
      - 'frontend/app.js'
      - 'frontend/board-presentation.js'
      - 'frontend/tests/board-preferences-idb.test.mjs'
      - 'frontend/tests/fixtures/board-preferences-browser.html'
      - 'scripts/board-preferences-browser.mjs'
      - '.github/workflows/board-preferences-indexeddb.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/board-preferences-idb.js'
      - 'frontend/app.js'
      - 'frontend/board-presentation.js'
      - 'frontend/tests/board-preferences-idb.test.mjs'
      - 'frontend/tests/fixtures/board-preferences-browser.html'
      - 'scripts/board-preferences-browser.mjs'
      - '.github/workflows/board-preferences-indexeddb.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  indexeddb:
    name: Scoped preference persistence and real Chromium IndexedDB acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify scoped preference schemas and denied local data writes
        run: node --test frontend/tests/board-preferences-idb.test.mjs frontend/tests/board-presentation.test.mjs
      - name: Verify actual IndexedDB storage, isolation, expiration and cleanup without production credentials
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER" || { echo 'BLOCKED: Chrome/Chromium unavailable'; exit 1; }
          set +e
          CHROME_BIN="$BROWSER" node scripts/board-preferences-browser.mjs
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then exit 0; fi
          if [ "$code" -ne 75 ]; then exit "$code"; fi
          echo 'Hosted Chrome startup unavailable; retrying once with a fresh profile.'
          sleep 2
          CHROME_BIN="$BROWSER" node scripts/board-preferences-browser.mjs
