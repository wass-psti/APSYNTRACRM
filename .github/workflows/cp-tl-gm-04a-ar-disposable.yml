name: CP-TL-GM-04A AR Disposable PostgreSQL
on:
  push:
    branches: [main]
    paths:
      - 'sql/candidates/cp-tl-gm-04a-ar-reconciliation.sql'
      - 'sql/tests/cp-tl-gm-04a-ar-disposable.sql'
      - '.github/workflows/cp-tl-gm-04a-ar-disposable.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ar-disposable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: tradelink_ar_disposable
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d tradelink_ar_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: tradelink_ar_disposable
      PGUSER: postgres
      PGPASSWORD: disposable_ci_only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Execute isolated financial regression fixtures
        run: |
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = tradelink_ar_disposable
          psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-tl-gm-04a-ar-disposable.sql
