name: CP-TL-03B Disposable PostgreSQL Acceptance
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}


on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cp-tl03b-disposable-postgres.yml'
      - 'sql/cp-tl03-staged-domain.sql'
      - 'sql/tradelink-documents-page-candidate.sql'
      - 'sql/tradelink-document-submit-candidate.sql'
      - 'sql/tradelink-document-review-revision-candidate.sql'
      - 'sql/tradelink-document-decision-candidate.sql'
      - 'sql/tradelink-document-operational-candidate.sql'
      - 'sql/tradelink-document-attachments-candidate.sql'
      - 'sql/tradelink-document-attachments-empty-rollback.sql'
      - 'sql/tests/cp-tl03-attachment-storage-fixture.sql'
      - 'sql/tests/cp-tl03-attachments-disposable.sql'
      - 'sql/tests/cp-tl03-operational-disposable.sql'
      - 'sql/tests/cp-tl03-decisions-disposable.sql'
      - 'sql/tests/cp-tl03-review-revision-disposable.sql'
      - 'sql/tests/cp-tl03-submit-disposable.sql'
      - 'sql/tests/cp-tl03-documents-page-disposable.sql'
      - 'sql/tests/cp-tl03-six-module-roundtrip-disposable.sql'
      - 'sql/tradelink-document-board-timestamp-candidate.sql'
      - 'sql/tradelink-document-lifecycle-timestamp-candidate.sql'
      - 'sql/tradelink-document-conflict-response-candidate.sql'
      - 'sql/cp-tl03c-write-permission-candidate.sql'
      - 'sql/cp-tl03c-stage-b-write-revoke-candidate.sql'
      - 'sql/cp-tl03c-emergency-disable-candidate.sql'
      - 'sql/tests/cp-tl03-*.sql'
      - 'sql/tests/cp-tl03c-*.sql'
      - 'frontend/tradelink-domain-client.js'
      - 'frontend/tests/tradelink-domain-*.test.mjs'
      - 'supabase/migrations/20261112091535_tradelink_for_approval_dual_review.sql'
      - 'supabase/migrations/20261112093727_tradelink_revision_required_edit_compat.sql'
      - 'supabase/migrations/20261113065300_tradelink_retry_safe_revision_bound_updates.sql'
      - 'sql/tests/cp-tl08e02-retry-safe-updates-disposable.sql'
      - 'sql/tests/cp-tl08h-virtual-review-acceptance.sql'

permissions:
  contents: read

jobs:
  disposable-postgres:
    name: Signed-fixture transactions, RBAC and RLS (PostgreSQL 17)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: tradelink_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tradelink_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: tradelink_disposable
      PGUSER: postgres
      PGPASSWORD: disposable_ci_only
      PGCONNECT_TIMEOUT: '5'
      PGOPTIONS: '-c statement_timeout=30000'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install PostgreSQL CLI (disposable runner only)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Assert isolated PostgreSQL runner identity
        run: |
          set -euo pipefail
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = tradelink_disposable
          psql -X -v ON_ERROR_STOP=1 -Atqc "SELECT current_database(), current_setting('server_version_num')::integer >= 170000" | grep -Fx 'tradelink_disposable|t'
      - name: Create synthetic board, users, JWT session and role fixture
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-tl03-disposable-setup.sql
      - name: Apply staged CP-TL-03 document contract to disposable database
        run: psql -X -v ON_ERROR_STOP=1 -f sql/cp-tl03-staged-domain.sql
      - name: Verify Stage A denies authenticated document writes
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-tl03c-stage-a-readonly.sql
      - name: Activate write grants ONLY in this disposable PostgreSQL runner
        run: psql -X -v ON_ERROR_STOP=1 -f sql/cp-tl03c-write-permission-candidate.sql
      - name: Verify pre-existing function upgrade in the same disposable database
        run: |
          set -euo pipefail
          # Reconstruct the exact previous function definition from the new
          # source in a *disposable fixture*, then test the pinned migration.
          # No production DB, project, or credentials are involved.
          python3 - <<'PY_FIXTURE'
          from pathlib import Path
          source=Path('sql/tradelink-document-board-timestamp-candidate.sql').read_text()
          start=source.index('CREATE OR REPLACE FUNCTION private.tl03_commit(')
          end=source.index('END $commit$;',start)+len('END $commit$;')
          fn=source[start:end]
          a=' group_id uuid; item_id uuid; rev bigint; modified_at timestamptz;'
          b=' group_id uuid; item_id uuid; rev bigint;'
          assert fn.count(a)==1
          fn=fn.replace(a,b)
          start_update=fn.index('    WHERE id=d.id RETURNING revision,updated_at INTO rev,modified_at;')
          end_update=fn.index("  ELSIF p_operation='archive' THEN",start_update)
          assert fn[start_update:end_update].count('UPDATE public.work_board_items')==1
          fn=fn[:start_update]+"    WHERE id=d.id RETURNING revision INTO rev;\n"+fn[end_update:]
          Path('/tmp/tl03-original-function.sql').write_text(fn)
          PY_FIXTURE
          psql -X -v ON_ERROR_STOP=1 -f /tmp/tl03-original-function.sql
          test "$(psql -X -v ON_ERROR_STOP=1 -Atqc "SELECT md5(pg_get_functiondef('private.tl03_commit(uuid,uuid,bigint,text,jsonb)'::regprocedure))")" = '661e491750fbc9eeb0f619d701496306'
          psql -X -v ON_ERROR_STOP=1 -f sql/tradelink-document-board-timestamp-candidate.sql
      - name: Upgrade lifecycle timestamps in the disposable database
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tradelink-document-lifecycle-timestamp-candidate.sql
      - name: Upgrade deterministic conflicts to HTTP 409 in the disposable database
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tradelink-document-conflict-response-candidate.sql
      - name: Install signed server-side TradeLink search in isolated PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tradelink-documents-page-candidate.sql
      - name: Test all-document keyset pagination, filters, and scope denials
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-tl03-documents-page-disposable.sql
      - name: Verify all six document modules persisted fields, revisions and Board integration
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-tl03-six-module-roundtrip-disposable.sql
      - name: Install signed Draft-submit workflow in isolated PostgreSQL only
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tradelink-document-submit-candidate.sql
      - name: Verify signed quotation and packing submission, invalid and foreign denials
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-tl03-submit-disposable.sql
      - name: Install assigned reviewer and revision-required editor in isolated PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tradelink-document-review-revision-candidate.sql
      - name: Verify assigned review, revision requests, edits, resubmission and signed history
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-tl03-review-revision-disposable.sql
      - name: Install commercial approval and reasoned rejection in isolated PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tradelink-document-decision-candidate.sql
      - name: Verify assigned approver, prior signed review, rejection reason, history and denial
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-tl03-decisions-disposable.sql
      - name: Install signed operational recording, completion and reopening in isolated PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tradelink-document-operational-candidate.sql
      - name: Verify authentic timestamps, completion prerequisites, resubmission cycles and denials
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-tl03-operational-disposable.sql
      - name: Install signed PDF stage candidate in isolated PostgreSQL only
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tradelink-electronic-pdf-approval-stage-candidate.sql
      - name: Test exact signed approvers, order, duplication, revision, narrow role and session denial
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-tl-pdf03-stage-acceptance.sql
      - name: Create synthetic Storage metadata fixture (no real Storage API calls)
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-tl03-attachment-storage-fixture.sql
      - name: Install signed TradeLink attachment contract in isolated PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tradelink-document-attachments-candidate.sql
      - name: Verify private Storage RLS, signed upload intents, CAS and audit
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-tl03-attachments-disposable.sql
      - name: Execute signed fixture, CAS, audit, RLS and denial acceptance
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-tl03-disposable-acceptance.sql
      - name: Check post-migration grants and board projection
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-tl03-postactivation-readonly.sql
      - name: Revoke Stage B write grants only, retaining Stage A reads (disposable)
        run: psql -X -v ON_ERROR_STOP=1 -f sql/cp-tl03c-stage-b-write-revoke-candidate.sql
      - name: Verify read continuity and record retention after narrow revoke
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-tl03c-disposable-write-revoke-acceptance.sql
      - name: Exercise nondestructive API disable in disposable PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f sql/cp-tl03c-emergency-disable-candidate.sql
      - name: Verify permissions are revoked but domain and board audit survive
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-tl03c-disposable-emergency-acceptance.sql
      - name: Rehearse guarded EMPTY-ONLY TradeLink attachment rollback in disposable PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tradelink-document-attachments-empty-rollback.sql
      - name: Run frontend adapter and SQL-contract regression tests
        run: node --test frontend/tests/tradelink-domain-client.test.mjs frontend/tests/tradelink-domain-sql-contract.test.mjs frontend/tests/tradelink-domain-stage-b-release-boundary.test.mjs
      - name: Verify independent signed concurrent approval attempts in isolated PostgreSQL
        run: bash scripts/cp-tl-pdf04-concurrent-approval.sh
      - name: Create isolated CP-TL-08E-02 retry database
        run: createdb --maintenance-db=postgres --username=postgres tradelink_retry_disposable
      - name: Install exact signed document-save migrations in isolated PostgreSQL
        env:
          PGDATABASE: tradelink_retry_disposable
        run: |
          psql -X -v ON_ERROR_STOP=1 \
            -f sql/tests/cp-tl03-disposable-setup.sql \
            -f sql/cp-tl03-staged-domain.sql \
            -f supabase/migrations/20261112091535_tradelink_for_approval_dual_review.sql \
            -f supabase/migrations/20261112093727_tradelink_revision_required_edit_compat.sql \
            -f supabase/migrations/20261113065300_tradelink_retry_safe_revision_bound_updates.sql
      - name: Verify CP-TL-08E-02 retry-safe reviewer substitution and revision integrity
        env:
          PGDATABASE: tradelink_retry_disposable
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-tl08e02-retry-safe-updates-disposable.sql
      - name: Create isolated CP-TL-08H dual-review database
        run: createdb --maintenance-db=postgres --username=postgres tradelink_review_disposable
      - name: Install signed dual-review migration in isolated PostgreSQL
        env:
          PGDATABASE: tradelink_review_disposable
        run: |
          psql -X -v ON_ERROR_STOP=1 \
            -f sql/tests/cp-tl03-disposable-setup.sql \
            -f sql/cp-tl03-staged-domain.sql \
            -f supabase/migrations/20261112091535_tradelink_for_approval_dual_review.sql
      - name: Verify CP-TL-08H independent reviewers, approval, retry and denial
        env:
          PGDATABASE: tradelink_review_disposable
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/cp-tl08h-virtual-review-acceptance.sql
