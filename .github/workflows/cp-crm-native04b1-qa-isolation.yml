name: CP-CRM-NATIVE-04B1 QA Isolation and Cross-Session Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cp-crm-native04b1-qa-isolation.yml'
      - 'scripts/cp-crm-native04b1-*'
      - 'frontend/tests/cp-crm-native04b1-*'
  push:
    branches: [main]
    paths:
      - '.github/workflows/cp-crm-native04b1-qa-isolation.yml'
      - 'scripts/cp-crm-native04b1-*'
      - 'frontend/tests/cp-crm-native04b1-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native04b1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cross-session:
    name: Disposable cross-session and QA-manifest guardrail acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify offline QA manifest and runner contracts
        run: |
          set -euo pipefail
          test -z "${SUPABASE_DB_URL:-}"
          test -z "${DATABASE_URL:-}"
          bash -n scripts/cp-crm-native04b1-tradelink-cross-session-disposable.sh
          node --check scripts/cp-crm-native04b1-qa-manifest.mjs
          node --test frontend/tests/cp-crm-native04b1-qa-manifest.test.mjs
          npx eslint scripts/cp-crm-native04b1-qa-manifest.mjs frontend/tests/cp-crm-native04b1-qa-manifest.test.mjs
      - name: PostgreSQL 17 durable independent-session readback
        run: bash scripts/cp-crm-native04b1-tradelink-cross-session-disposable.sh
      - name: Full frontend regression
        run: npm test
