name: CP-TL-03D Reference-driven TradeLink UI (nonproduction)
on:
  push:
    branches:
      - feature/cp-tl03d-reference-ui-20261107
    paths:
      - 'frontend/tradelink-application.js'
      - 'frontend/tradelink-draft-workspace.js'
      - 'frontend/tradelink-reference-ui.css'
      - 'frontend/tests/tradelink-reference-ui.test.mjs'
      - 'index.html'
      - '.github/workflows/cp-tl03d-reference-ui.yml'
  pull_request:
    paths:
      - 'frontend/tradelink-application.js'
      - 'frontend/tradelink-draft-workspace.js'
      - 'frontend/tradelink-reference-ui.css'
      - 'frontend/tests/tradelink-reference-ui.test.mjs'
      - 'index.html'
      - '.github/workflows/cp-tl03d-reference-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-ui:
    name: Signed UI regressions and reference CSS integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify existing Pages source and module graph
        run: node scripts/verify-pages-source.mjs
      - name: Validate all shipped module syntax
        run: |
          set -euo pipefail
          for source in frontend/*.js; do node --check "$source"; done
      - name: Prove reference DOM/validation/gate contracts in six Draft modules
        run: |
          set -euo pipefail
          node --test frontend/tests/tradelink-reference-ui.test.mjs frontend/tests/tradelink-draft-workspace.test.mjs frontend/tests/tradelink-activity.test.mjs frontend/tests/tradelink-domain-client.test.mjs
      - name: Full frontend regression with no production credentials
        run: node --test frontend/tests/*.test.mjs
