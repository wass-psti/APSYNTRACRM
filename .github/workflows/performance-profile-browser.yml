name: APSYNTRA On-Demand Performance Profile Acceptance
on:
  pull_request:
    paths:
      - 'frontend/performance-profile.js'
      - 'frontend/performance-critical-path.js'
      - 'frontend/performance-entry-waterfall.js'
      - 'frontend/tests/performance-entry-waterfall.test.mjs'
      - 'frontend/workspace-startup-read.js'
      - 'frontend/tests/workspace-startup-read.test.mjs'
      - 'frontend/tests/performance-critical-path.test.mjs'
      - 'frontend/tests/performance-profile.test.mjs'
      - 'frontend/tests/fixtures/performance-profile-browser.html'
      - 'frontend/app.js'
      - 'scripts/performance-profile-browser.mjs'
      - '.github/workflows/performance-profile-browser.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/performance-profile.js'
      - 'frontend/performance-critical-path.js'
      - 'frontend/performance-entry-waterfall.js'
      - 'frontend/tests/performance-entry-waterfall.test.mjs'
      - 'frontend/workspace-startup-read.js'
      - 'frontend/tests/workspace-startup-read.test.mjs'
      - 'frontend/tests/performance-critical-path.test.mjs'
      - 'frontend/tests/performance-profile.test.mjs'
      - 'frontend/tests/fixtures/performance-profile-browser.html'
      - 'frontend/app.js'
      - 'scripts/performance-profile-browser.mjs'
      - '.github/workflows/performance-profile-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-performance-profile:
    name: Isolated real Chromium opt-in frame timing and privacy acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify bounded local sampling, cancellation and privacy constraints
        run: node --test frontend/tests/performance-profile.test.mjs frontend/tests/performance-critical-path.test.mjs frontend/tests/performance-entry-waterfall.test.mjs frontend/tests/workspace-startup-read.test.mjs frontend/tests/settings-experience.test.mjs
      - name: Verify actual finite Chromium frame sample without credentials
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER" || { echo 'BLOCKED: Chrome/Chromium unavailable'; exit 1; }
          set +e
          CHROME_BIN="$BROWSER" node scripts/performance-profile-browser.mjs
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then exit 0; fi
          if [ "$code" -ne 75 ]; then exit "$code"; fi
          echo 'Retry isolated browser launch once; never retry test assertion failures.'
          sleep 2
          CHROME_BIN="$BROWSER" node scripts/performance-profile-browser.mjs
