name: Material Sourcing Schema Plan Safety
on:
  pull_request:
    paths:
      - 'frontend/material-sourcing-schema-plan.js'
      - 'frontend/tests/material-sourcing-schema-plan.test.mjs'
      - 'frontend/board-structure-admin.js'
      - 'frontend/board-grid.js'
      - 'frontend/board-manifest.js'
      - '.github/workflows/material-sourcing-schema-plan.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/material-sourcing-schema-plan.js'
      - 'frontend/tests/material-sourcing-schema-plan.test.mjs'
      - 'frontend/board-structure-admin.js'
      - 'frontend/board-grid.js'
      - 'frontend/board-manifest.js'
      - '.github/workflows/material-sourcing-schema-plan.yml'
permissions:
  contents: read
jobs:
  read-only-alignment-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check pure plan syntax
        run: node --check frontend/material-sourcing-schema-plan.js
      - name: Verify group identity, schema capacity and authorization blockers
        run: node --test frontend/tests/material-sourcing-schema-plan.test.mjs frontend/tests/board-structure-admin.test.mjs frontend/tests/board-column-catalog.test.mjs
