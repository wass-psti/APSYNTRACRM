name: CP-TT Bootstrap OT signed browser acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/cp-tt-bootstrap-ot03.yml"
      - "frontend/app.js"
      - "frontend/time-tracker-*.js"
      - "frontend/tests/time-tracker-overtime.test.mjs"
      - "frontend/tests/time-tracker-duration-overtime-policy.test.mjs"
      - "frontend/time-tracker-duration-overtime-policy.js"
      - "supabase/migrations/20261126120000_cp_tt_duration_overtime.sql"
      - "supabase/migrations/20261126181000_cp_tt_duration_only_ot_review.sql"
      - "sql/tests/cp-tt-duration-ot-prerequisites.sql"
      - "supabase/tests/tt_duration_overtime_staged.integration.sql"
      - "supabase/tests/tt_manual_attendance_duration_ot_joint.integration.sql"
      - "scripts/cp-tt-bootstrap-ot02-signed-disposable.*"
      - "scripts/cp-tt-bootstrap-ot03-browser.mjs"
      - "scripts/time-tracker-browser-acceptance.mjs"
      - "supabase/migrations/20261123180000_cp_tt_bootstrap_ot_self_review_01.sql"
      - "supabase/migrations/20261124170000_cp_tt_ot_creator_withdrawal.sql"
      - "supabase/migration-source-manifest.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/cp-tt-bootstrap-ot03.yml"
      - "frontend/app.js"
      - "frontend/time-tracker-*.js"
      - "frontend/tests/time-tracker-overtime.test.mjs"
      - "frontend/tests/time-tracker-duration-overtime-policy.test.mjs"
      - "frontend/time-tracker-duration-overtime-policy.js"
      - "supabase/migrations/20261126120000_cp_tt_duration_overtime.sql"
      - "supabase/migrations/20261126181000_cp_tt_duration_only_ot_review.sql"
      - "sql/tests/cp-tt-duration-ot-prerequisites.sql"
      - "supabase/tests/tt_duration_overtime_staged.integration.sql"
      - "supabase/tests/tt_manual_attendance_duration_ot_joint.integration.sql"
      - "scripts/cp-tt-bootstrap-ot02-signed-disposable.*"
      - "scripts/cp-tt-bootstrap-ot03-browser.mjs"
  # Keep disposable SQL fixtures and the registered duration migration in both trigger path lists.
  # The worker fixture replays the actual current-main migration source.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cp-tt-bootstrap-ot03-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-ot-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked frontend and browser dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate TimeTracker OT contract and migration manifest
        run: |
          node --test frontend/tests/time-tracker-overtime.test.mjs frontend/tests/time-tracker-duration-overtime-policy.test.mjs frontend/tests/time-tracker-ot-withdrawal.test.mjs
          node scripts/verify-migration-source-manifest.mjs
          node --check scripts/cp-tt-bootstrap-ot03-browser.mjs
          bash -n scripts/cp-tt-bootstrap-ot02-signed-disposable.sh
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Real signed disposable GoTrue, PostgreSQL and Chromium OT acceptance
        env:
          CP_TT_OT03_BROWSER: "1"
        run: bash scripts/cp-tt-bootstrap-ot02-signed-disposable.sh

  joint-postgres-17:
    name: Joint manual attendance and OT migration (${{ matrix.order }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        order: [manual-first, ot-first]
    defaults:
      run:
        working-directory: manual-fixture
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/apsyntra_tt_manual_hybrid_disposable
    steps:
      - name: Checkout OT candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout verified Manual Attendance fixture
        uses: actions/checkout@v4
        with:
          ref: 'e2d493fe78e50e7f6dc6df4a3496a41873de4f41'
          path: manual-fixture
          persist-credentials: false

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create disposable database
        run: |
          set -euo pipefail
          until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres; do sleep 1; done
          createdb apsyntra_tt_manual_hybrid_disposable

      - name: Install TimeTracker base fixtures
        run: |
          set -euo pipefail
          for file in \
            sql/tests/cp-board-collab01-disposable-setup.sql \
            sql/tests/cp-tt-gps01-disposable-setup.sql \
            sql/tests/cp-tt-gps01-live-commit-baseline.sql \
            sql/cp-tt-gps01-atomic-board-projection.sql \
            sql/tests/cp-tt-admin-record-management-disposable-setup.sql \
            supabase/migrations/20261116084228_cp_tt_attendance_admin_record_management_01.sql \
            sql/cp-tt-ot01-staged-bootstrap-approval.sql \
            sql/tests/cp-tt-auto-clockout-02-disposable-setup.sql
          do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Apply existing auto-clockout worker migrations
        run: |
          set -euo pipefail
          for file in \
            supabase/migrations/20261119200735_cp_tt_auto_clockout_01_conditional_session_expiration.sql \
            supabase/migrations/20261119203503_cp_tt_auto_clockout_01_snapshot_overtime_cutoff.sql \
            supabase/migrations/20261119203633_cp_tt_auto_clockout_01_snapshot_overtime_cutoff_fix.sql \
            supabase/migrations/20261119204157_cp_tt_auto_clockout_01_grace_overtime_boundary.sql
          do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f sql/tests/cp-tt-auto-clockout-02-disposable-acceptance.sql

      - name: Apply department and workspace-scope prerequisites
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261120100000_cp_tt_employee_departments_qol.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f sql/tests/cp-tt-admin-manual-attendance-hybrid-disposable-setup.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261120140000_cp_tt_department_catalog_management.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261120170000_cp_tt_auto_clockout_02c_atomic_board_projection_restore.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261120120000_cp_tt_employee_departments_and_time_corrections.sql \
            -f supabase/migrations/20261120183000_cp_tt_optional_attendance_correction_note.sql

      - name: Apply live clock, manual attendance and isolated scheduler migrations
        run: |
          set -euo pipefail
          for file in \
            supabase/migrations/20261124050317_cp_tt_deferred_foreground_clockout_01.sql \
            supabase/migrations/20261124193000_cp_tt_default_server_auto_clockout_9h.sql \
            supabase/migrations/20261124203000_cp_tt_admin_manual_clockout.sql \
            supabase/migrations/20261125090000_cp_tt_admin_manual_clockin.sql \
            supabase/migrations/20261125100000_cp_tt_auto_clockout_isolation.sql \
            supabase/migrations/20261125120000_cp_tt_company_provisioning_workspace_scope.sql \
            supabase/migrations/20261125130000_cp_tt_auto_clockout_reactivation.sql \
            supabase/migrations/20261126090000_cp_tt_active_clockin_scheduler_correction.sql
          do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Install current legacy OT prerequisites
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA IF NOT EXISTS realtime;
          CREATE TABLE realtime.messages(payload jsonb,event text,topic text,private boolean);
          CREATE FUNCTION realtime.send(payload jsonb,event text,topic text,private boolean DEFAULT true)
          RETURNS void LANGUAGE sql AS $$ INSERT INTO realtime.messages VALUES($1,$2,$3,$4) $$;
          SQL
          for file in \
            supabase/migrations/20261123160000_cp_tt_manual_ot_01_manual_submission_and_scoped_review.sql \
            supabase/migrations/20261123170000_cp_tt_hr_ot_all_user_log_01.sql \
            supabase/migrations/20261123180000_cp_tt_bootstrap_ot_self_review_01.sql \
            supabase/migrations/20261124170000_cp_tt_ot_creator_withdrawal.sql
          do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Apply both actual candidate migrations in isolated PostgreSQL
        env:
          MERGE_ORDER: ${{ matrix.order }}
        run: |
          set -euo pipefail
          manual() {
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20261126100000_cp_tt_admin_manual_clockin_scheduler_gate.sql \
              -f supabase/migrations/20261126110000_cp_tt_admin_manual_attendance_hybrid.sql
          }
          overtime() {
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../supabase/migrations/20261126120000_cp_tt_duration_overtime.sql
          }
          if [ "$MERGE_ORDER" = manual-first ]; then manual; overtime; else overtime; manual; fi
      - name: Run hybrid and joint manual-OT acceptance
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/tt_admin_manual_attendance_hybrid.integration.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../supabase/tests/tt_manual_attendance_duration_ot_joint.integration.sql
