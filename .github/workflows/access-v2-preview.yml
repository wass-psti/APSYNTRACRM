name: Access Model V2 React Preview
on:
  pull_request:
    paths:
      - 'access-preview/**'
      - 'scripts/access-v2-browser-acceptance.mjs'
      - '.github/workflows/access-v2-preview.yml'
  workflow_dispatch:
jobs:
  react-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-audit --no-fund
        working-directory: access-preview
      - run: npm run build
        working-directory: access-preview
      - name: Verify four screens in real Chromium
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN" || { echo 'Chromium unavailable'; exit 1; }
          node scripts/access-v2-browser-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apsyntra-access-v2-preview-screenshots
          path: artifacts/access-v2/*.png
          if-no-files-found: ignore
