name: FuelTrack v3 Disposable Backend Acceptance
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261109115106_fueltrack_v3_backend_core.sql'
      - 'supabase/migrations/20261109235500_fueltrack_v3_board_receipts.sql'
      - 'sql/tests/fueltrack-v3-*.sql'
      - 'scripts/fueltrack-v3-backend-disposable.sh'
      - 'scripts/fueltrack-v3-signed-read-acceptance*.mjs'
      - 'scripts/fueltrack-v3-provider-backup-gate*.mjs'
      - 'scripts/ft3-recovery-archive-audit*.mjs'
      - 'scripts/ft3-recovery-rto-rehearsal*.mjs'
      - 'scripts/ft3-rpo-observation*.mjs'
      - 'scripts/ft3-recovery-retention-gate*.mjs'
      - 'scripts/ft3-recovery-set-stage*.mjs'
      - 'scripts/ft3-backup-crypto*.mjs'
      - 'scripts/ft3-offsite-policy-preflight*.mjs'
      - 'scripts/ft3-s3-infrastructure-contract.test.mjs'
      - 'scripts/ft3-encrypted-recovery-bundle*.mjs'
      - 'infra/fueltrack-recovery/s3-object-lock.template.json'
      - '.github/workflows/fueltrack-v3-backend-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-postgres:
    name: Isolated PostgreSQL contract, denial and migration checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Verify Shell Syntax
        run: bash -n scripts/fueltrack-v3-backend-disposable.sh
      - name: Verify Board and Receipt database transactions
        run: ./scripts/fueltrack-v3-backend-disposable.sh
      - name: Verify signed read-only acceptance contract without live credentials
        run: node --test scripts/fueltrack-v3-signed-read-acceptance.test.mjs
      - name: Verify provider backup release gate remains fail-closed
        run: node --test scripts/fueltrack-v3-provider-backup-gate.test.mjs
      - name: Verify offline database and private Storage archive integrity gates
        run: node --test scripts/ft3-recovery-archive-audit.test.mjs
      - name: Verify local recovery timing and production release gate
        run: node --test scripts/ft3-recovery-rto-rehearsal.test.mjs
      - name: Verify rolling RPO observations never certify production recovery
        run: node --test scripts/ft3-rpo-observation.test.mjs
      - name: Verify retention cadence and offsite assurance checks remain fail closed
        run: node --test scripts/ft3-recovery-retention-gate.test.mjs
      - name: Verify atomic local recovery set staging and tamper denials
        run: node --test scripts/ft3-recovery-set-stage.test.mjs
      - name: Verify local authenticated backup encryption and tamper rejection
        run: node --test scripts/ft3-backup-crypto.test.mjs
      - name: Verify offsite provider retention preflight rejects unsafe plans
        run: node --test scripts/ft3-offsite-policy-preflight.test.mjs
      - name: Verify nondeployed S3 Compliance/IAM infrastructure template
        run: node --test scripts/ft3-s3-infrastructure-contract.test.mjs
      - name: Verify authenticated encrypted SQL and private Storage recovery bundle
        run: node --test scripts/ft3-encrypted-recovery-bundle.test.mjs
