<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FM1 Component Acceptance Fixture</title>
    <link rel="icon" href="../../apsyntra-logo.webp" type="image/webp" />
    <link rel="stylesheet" href="../../apsyntra-styles.bundle.css" />
  </head>
  <body>
    <main style="max-width: 1500px; margin: 0 auto; padding: 24px">
      <div id="fm1-application-root"></div>
    </main>
    <script type="module">
      const params = new URLSearchParams(location.search);
      if (params.get("disableCustomElements") === "true") {
        Object.defineProperty(window, "customElements", {
          configurable: true,
          value: null,
        });
      }
      const { mountFm1Application } = await import("../../fm1/index.js");
      window.__fm1Mount = mountFm1Application;
      mountFm1Application(document.querySelector("#fm1-application-root"), {
        userId: params.get("user") || "fixture-user",
        workspaceId: params.get("workspace") || "fixture-workspace",
      });
    </script>
  </body>
</html>
