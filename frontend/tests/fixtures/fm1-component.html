<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FM1 Component Acceptance Fixture</title>
    <link rel="icon" href="../../apsyntra-logo.webp" type="image/webp" />
    <link rel="stylesheet" href="../../apsyntra-styles.bundle.css" />
  </head>
  <body>
    <main style="max-width: 1500px; margin: 0 auto; padding: 24px">
      <div id="fm1-application-root"></div>
    </main>
    <script type="module">
      const params = new URLSearchParams(location.search);
      if (params.get("disableCustomElements") === "true") {
        Object.defineProperty(window, "customElements", {
          configurable: true,
          value: null,
        });
      }
      const { mountFm1Application } = await import("../../fm1/index.js");
      window.__fm1Mount = mountFm1Application;
      const mockServer = params.get("mockServer") === "true";
      const workspaceId = mockServer
        ? "00000000-0000-4000-8000-000000000001"
        : params.get("workspace") || "fixture-workspace";
      const userId = mockServer
        ? "00000000-0000-4000-8000-000000000002"
        : params.get("user") || "fixture-user";
      let ticket = {
        id: "00000000-0000-4000-8000-000000000003",
        ticket_number: "FM1-2026-000001",
        workspace_id: workspaceId,
        requester_name: "FM1 Browser Operator",
        callback_number: "+639171234567",
        subject: "Browser acceptance incident",
        description:
          "A synthetic incident used only by the isolated browser fixture.",
        priority_requested: "P2",
        priority_effective: "P2",
        production_impact: "degraded",
        production_stopped: false,
        safety_concern: false,
        reporting_channel: "portal",
        asset_reference: "FM1-TEST-01",
        received_at: "2026-11-16T08:00:00Z",
        status: "In Progress",
        revision: 1,
        sla_activation_state: "NOT_ACTIVE",
        assigned_to: null,
      };
      const conversations = [];
      const ticketEvents = [];
      let warningPolicy = {
        workspace_id: workspaceId,
        enabled: false,
        policy_state: "NOT_CONFIGURED",
        human_response_before_seconds: null,
        engineering_start_before_seconds: null,
        restoration_before_seconds: null,
        revision: 0,
      };
      const notifications = [
        {
          id: "00000000-0000-4000-8000-000000000008",
          ticket_id: ticket.id,
          ticket_number: ticket.ticket_number,
          subject: ticket.subject,
          event_type: "TicketReceived",
          title: "New FM1 incident",
          message: "A new incident was received: Browser acceptance incident",
          created_at: "2026-11-16T08:00:00Z",
          read_at: null,
        },
      ];
      const holds = [
        {
          id: "00000000-0000-4000-8000-000000000004",
          metric: "engineering_start",
          reason: "missing_access",
          requested_at: "2026-11-16T08:10:00Z",
          external_owner: "Synthetic client IT",
          required_action: "Provide temporary diagnostic access",
          evidence:
            "Remote access request is pending with the client IT contact.",
          expected_review_at: "2026-11-16T10:00:00Z",
          validation_state: "pending",
          resumed_at: null,
        },
        {
          id: "00000000-0000-4000-8000-000000000005",
          metric: "restoration",
          reason: "spares",
          requested_at: "2026-11-16T08:15:00Z",
          external_owner: "Synthetic warehouse",
          required_action: "Deliver replacement sensor",
          evidence: "Warehouse confirmed the sensor is awaiting dispatch.",
          expected_review_at: "2026-11-16T12:00:00Z",
          validation_state: "validated",
          resumed_at: null,
        },
      ];
      if (mockServer) {
        window.__fm1Calls = [];
        window.__fm1ForceNextTicketConflict = false;
        const api = {
          rpc: async (name, args) => {
            window.__fm1Calls.push({ name, args });
            if (name === "fm1_service_status_v1") {
              return {
                service: {
                  service_key: "BIOTECH-FM1-2027",
                  execution_state: "awaiting_acceptance",
                  readiness_state: "pending",
                },
                decisions: [],
                assignees: [
                  {
                    id: "00000000-0000-4000-8000-000000000004",
                    display_name: "Fixture Assignee",
                    email: "assignee@example.invalid",
                  },
                ],
                metrics: {
                  total_tickets: 1,
                  open_tickets: 1,
                  p1p2_tickets: 1,
                  unassigned_p1p2: ticket.assigned_to ? 0 : 1,
                  sla_active_tickets: 0,
                  breached_obligations: 0,
                  approaching_deadlines: null,
                  approaching_deadline_policy: "NOT_CONFIGURED",
                },
                unassigned_urgent: ticket.assigned_to ? [] : [{ ...ticket }],
                notification_delivery: { queued: 0, failed: 0, delivered: 0 },
                sla_activation_state: "PENDING_ACCEPTANCE_AND_READINESS",
                internal_notifications_enabled: true,
              };
            }
            if (name === "fm1_list_tickets_v1") {
              const search = String(args.p_search || "").toLowerCase();
              const matches =
                (!search ||
                  [
                    ticket.ticket_number,
                    ticket.subject,
                    ticket.requester_name,
                  ].some((value) =>
                    String(value || "")
                      .toLowerCase()
                      .includes(search),
                  )) &&
                (!args.p_status || args.p_status === ticket.status) &&
                (!args.p_priority ||
                  args.p_priority === ticket.priority_effective);
              const filtered = matches ? [ticket] : [];
              return {
                items: filtered.slice(
                  args.p_offset,
                  args.p_offset + args.p_limit,
                ),
                total:
                  search || args.p_status || args.p_priority
                    ? filtered.length
                    : 51,
                limit: args.p_limit,
                offset: args.p_offset,
              };
            }
            if (name === "fm1_operational_report_v1") {
              return {
                metrics: {
                  total_tickets: 1,
                  open_tickets: 1,
                  closed_tickets: 0,
                  cancelled_tickets: 0,
                  p1p2_tickets: 1,
                  unassigned_p1p2: ticket.assigned_to ? 0 : 1,
                  assigned_open_tickets: ticket.assigned_to ? 1 : 0,
                  sla_active_tickets: 0,
                  status_breakdown: { [ticket.status]: 1 },
                  priority_breakdown: { [ticket.priority_effective]: 1 },
                  assignment_breakdown: {
                    assigned: ticket.assigned_to ? 1 : 0,
                    unassigned: ticket.assigned_to ? 0 : 1,
                  },
                  obligation_breakdown: {},
                  breached_obligations: 0,
                  milestone_breakdown: {},
                  approaching_deadlines: 0,
                },
                assignee_breakdown: ticket.assigned_to
                  ? [
                      {
                        assignee_id: ticket.assigned_to,
                        assignee_name: "Fixture Assignee",
                        ticket_count: 1,
                      },
                    ]
                  : [],
                unassigned_urgent: ticket.assigned_to ? [] : [{ ...ticket }],
                notification_delivery: {
                  queued: 0,
                  failed: 0,
                  delivered: 2,
                  pending_configuration: 0,
                  retrying: 0,
                },
                current_assignments: ticket.assigned_to
                  ? [
                      {
                        id: ticket.id,
                        ticket_id: ticket.id,
                        ticket_number: ticket.ticket_number,
                        subject: ticket.subject,
                        status: ticket.status,
                        priority_effective: ticket.priority_effective,
                        assigned_to: ticket.assigned_to,
                        assignee_name: "Fixture Assignee",
                        received_at: ticket.received_at,
                      },
                    ]
                  : [],
                sla_active_incidents: [],
                approaching_deadlines: [],
                breached_obligations: [],
                recent_escalations: [],
                recent_lifecycle_history: ticketEvents.map((item) => ({
                  ...item,
                  ticket_id: ticket.id,
                  ticket_number: ticket.ticket_number,
                  subject: ticket.subject,
                  recorded_at: new Date().toISOString(),
                })),
              };
            }
            if (name === "fm1_deadline_warning_policy_v1")
              return { ...warningPolicy };
            if (name === "fm1_update_deadline_warning_policy_v1") {
              warningPolicy = {
                workspace_id: workspaceId,
                enabled: args.p_enabled,
                policy_state: args.p_enabled ? "ACTIVE" : "INACTIVE",
                human_response_before_seconds:
                  args.p_human_response_before_seconds,
                engineering_start_before_seconds:
                  args.p_engineering_start_before_seconds,
                restoration_before_seconds: args.p_restoration_before_seconds,
                revision: warningPolicy.revision + 1,
              };
              return { ...warningPolicy };
            }
            if (name === "fm1_update_ticket_v1") {
              if (window.__fm1ForceNextTicketConflict) {
                window.__fm1ForceNextTicketConflict = false;
                ticket = {
                  ...ticket,
                  requester_name: "Concurrent Server Operator",
                  revision: ticket.revision + 1,
                };
                const conflict = new Error(
                  "FM1 ticket revision changed; refresh before retrying",
                );
                conflict.code = "40001";
                throw conflict;
              }
              if (args.p_expected_revision !== ticket.revision) {
                const conflict = new Error(
                  "FM1 ticket revision changed; refresh before retrying",
                );
                conflict.code = "40001";
                throw conflict;
              }
              ticket = {
                ...ticket,
                requester_name: args.p_requester_name,
                callback_number: args.p_callback_number,
                subject: args.p_subject,
                description: args.p_description,
                production_impact: args.p_production_impact,
                production_stopped: args.p_production_stopped,
                safety_concern: args.p_safety_concern,
                asset_reference: args.p_asset_reference,
                revision: ticket.revision + 1,
              };
              ticketEvents.push({
                event_id: "00000000-0000-4000-8000-000000000009",
                event_type: "IncidentDetailsUpdated",
                actor_id: userId,
                occurred_at: new Date().toISOString(),
                payload: {
                  after: {
                    subject: ticket.subject,
                    requester_name: ticket.requester_name,
                  },
                },
              });
              return {
                ticket: { ...ticket },
                changed: true,
                idempotent_replay: false,
              };
            }
            if (name === "fm1_notification_inbox_v1")
              return {
                items: notifications.map((item) => ({ ...item })),
                unread_total: notifications.filter((item) => !item.read_at)
                  .length,
                limit: args.p_limit,
                offset: args.p_offset,
              };
            if (name === "fm1_notification_mark_read_v1") {
              const notification = notifications.find(
                (item) => item.id === args.p_notification_id,
              );
              if (!notification)
                throw new Error("Unknown fixture notification");
              notification.read_at =
                notification.read_at || new Date().toISOString();
              return {
                notification: {
                  id: notification.id,
                  read_at: notification.read_at,
                },
                idempotent_replay: false,
              };
            }
            if (name === "fm1_ticket_detail_v1") {
              return {
                ticket: { ...ticket },
                obligations: [],
                events: ticketEvents.map((item) => ({
                  ...item,
                  source: "crm",
                })),
                milestones: [],
                holds: holds.map((item) => ({ ...item })),
                audit: [],
                conversations: conversations.map((item) => ({ ...item })),
              };
            }
            if (name === "fm1_assign_ticket_v1") {
              ticket = {
                ...ticket,
                assigned_to: args.p_assignee_id,
                revision: ticket.revision + 1,
              };
              return {
                ticket: { ...ticket },
                changed: true,
                idempotent_replay: false,
              };
            }
            if (name === "fm1_add_conversation_v1") {
              const conversation = {
                id: "00000000-0000-4000-8000-000000000007",
                ticket_id: ticket.id,
                actor_id: userId,
                actor_display_name: "Fixture Operator",
                visibility: args.p_visibility,
                body: args.p_body,
                created_at: new Date().toISOString(),
              };
              conversations.push(conversation);
              ticket = { ...ticket, revision: ticket.revision + 1 };
              return {
                conversation,
                ticket_revision: ticket.revision,
                idempotent_replay: false,
                external_delivery: "NOT_CONFIGURED",
              };
            }
            if (name === "fm1_record_priority_v1") {
              ticket = {
                ...ticket,
                priority_requested: args.p_requested_priority,
                priority_effective: args.p_effective_priority,
                revision: ticket.revision + 1,
              };
              return {
                ticket,
                priority_event: { decision_state: "pending_d03" },
                sla_recalculation: "NEEDS_REVIEW_PENDING_D03",
              };
            }
            if (name === "fm1_request_hold_v1") {
              holds.push({
                id: "00000000-0000-4000-8000-000000000006",
                metric: args.p_metric,
                reason: args.p_reason,
                requested_at: new Date().toISOString(),
                external_owner: args.p_external_owner,
                required_action: args.p_required_action,
                evidence: args.p_evidence,
                expected_review_at: args.p_expected_review_at,
                validation_state: "pending",
                resumed_at: null,
              });
              ticket = { ...ticket, revision: ticket.revision + 1 };
              return {
                hold: holds[holds.length - 1],
                clock_effect: "NONE_PENDING_VALIDATION",
              };
            }
            if (name === "fm1_validate_hold_v1") {
              const hold = holds.find((item) => item.id === args.p_hold_id);
              hold.validation_state = args.p_decision;
              ticket = { ...ticket, revision: ticket.revision + 1 };
              return { hold };
            }
            if (name === "fm1_end_hold_v1") {
              const hold = holds.find((item) => item.id === args.p_hold_id);
              hold.validation_state = "ended";
              hold.resumed_at = new Date().toISOString();
              ticket = { ...ticket, revision: ticket.revision + 1 };
              return { hold };
            }
            throw new Error("Unexpected fixture RPC: " + name);
          },
        };
        mountFm1Application(document.querySelector("#fm1-application-root"), {
          userId,
          workspaceId,
          api,
        });
      } else {
        mountFm1Application(document.querySelector("#fm1-application-root"), {
          userId,
          workspaceId,
        });
      }
    </script>
  </body>
</html>
