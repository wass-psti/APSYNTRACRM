<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Isolated CRM benchmark</title><link rel="stylesheet" href="../../apsyntra-styles.bundle.css"></head>
<body><div id="app"></div><script type="module">
import {updateExistingApplicationShell} from '../../application-shell-dom.js';
import {sidebarActiveRoute} from '../../sidebar-active-route.js';
import {boardTable} from '../../board/presentation/presentation.js';
import {resetBoardWindows} from '../../board/presentation/window.js';
import {sampleBrowserFrames} from '../../performance-profile.js';

const root=document.querySelector('#app');
const frame=()=>new Promise(resolve=>requestAnimationFrame(resolve));
const twoFrames=async()=>{await frame();await frame();};
const tableRows=size=>Array.from({length:size},(_,index)=>({
 itemId:'fixture-'+index,search:'Fixture row '+index,
 cells:{record:'Fixture row '+index,status:'Pending',date:'2026-11-27'}
}));
const columns=[{key:'record',title:'Item'},{key:'status',title:'Status'},{key:'date',title:'Date'}];
window.crmBaseline={
 async shell(inventory,repetitions){
  const recentBoardIds=inventory.filter(app=>app.kind==='board').map(app=>app.route.split('/').at(-1));
  const sidebar=()=>'<aside class="aps-sidebar"><div class="sidebar-nav-scroll">'+
   [{route:'#/overview',label:'Overview'},...inventory].map(app=>
    '<a class="nav-link" href="'+app.route+'">'+app.label+'</a>').join('')+'</div></aside>';
  root.innerHTML='<div class="shell">'+sidebar()+'<main class="main"><header class="topbar">'+
   '<div class="breadcrumb"><strong>Overview</strong></div><div class="top-avatar">QA</div>'+
   '</header><div class="main-content"></div></main></div>';
  const shell=root.querySelector('.shell'),side=shell.querySelector('.aps-sidebar'),
   header=shell.querySelector('.topbar'),host=shell.querySelector('.main-content');
  const content=app=>'<section data-fixture-route="'+app.id+'"><h1>'+app.label+'</h1>'+
   boardTable({columns,rows:tableRows(25),virtualize:false})+'</section>';
  const results=inventory.map(app=>({id:app.id,retainedShell:true,retainedSidebar:true,retainedHeader:true,samples:[]}));
  for(let i=0;i<repetitions;i++)for(let n=0;n<inventory.length;n++){
   const app=inventory[n],result=results[n],start=performance.now();
   const selected=sidebarActiveRoute(app.route,{recentBoardIds});
   updateExistingApplicationShell({existing:shell,renderedSidebarSignature:'fixture',
    sidebarSignature:'fixture',renderSidebar:sidebar,selectedNavigation:selected,
    breadcrumb:app.label,avatarMarkup:'QA',body:content(app)});
   const updateMs=performance.now()-start;
   await twoFrames();
   result.samples.push({updateMs,twoFrameMs:performance.now()-start});
   result.retainedShell&&=root.querySelector('.shell')===shell&&shell.querySelector('.main-content')===host;
   result.retainedSidebar&&=shell.querySelector('.aps-sidebar')===side;
   result.retainedHeader&&=shell.querySelector('.topbar')===header;
   if(host.querySelector('[data-fixture-route]')?.dataset.fixtureRoute!==app.id||
     side.querySelector('[aria-current="page"]')?.getAttribute('href')!==app.route)
    throw Error('Fixture route did not render or select its expected destination: '+app.id);
  }
  return results;
 },
 async board(size,repetitions){
  const rows=tableRows(size),samples=[];
  root.innerHTML='<main class="main"><div class="main-content"></div></main>';
  const host=root.querySelector('.main-content');
  for(let i=0;i<repetitions;i++){
   resetBoardWindows();
   const start=performance.now();
   host.innerHTML=boardTable({columns,rows,groupId:'fixture',virtualize:true});
   const updateMs=performance.now()-start;
   await twoFrames();
   samples.push({updateMs,twoFrameMs:performance.now()-start,
    renderedRows:host.querySelectorAll('tbody tr[aria-rowindex]').length});
  }
  resetBoardWindows();
  return samples;
 },
 frames:()=>sampleBrowserFrames({durationMs:1000})
};
</script></body></html>
