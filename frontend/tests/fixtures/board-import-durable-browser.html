<!doctype html><html lang="en"><head><meta charset="utf-8"><title>BIMP-15A disposable browser</title></head><body>
<script type="module">
import {openBoardImportWizard} from '../../board-import-ui.js';
import {parseImportFile} from '../../board-import-parse.js';
import {initialImportMappings,buildImportPlan} from '../../board-import-core.js';
import {sealImportRecovery,readImportRecovery} from '../../board-import-durable.js';
const ids={user:'11111111-1111-4111-8111-111111111111',
 board:'22222222-2222-4222-8222-222222222222',
 workspace:'33333333-3333-4333-8333-333333333333',
 group:'44444444-4444-4444-8444-444444444444',
 column:'55555555-5555-4555-8555-555555555555'};
const original={board:{id:ids.board,workspace_id:ids.workspace,
 status:'active',name:'BIMP Durable Ordinary QA',updated_at:'2026-11-12T00:00:00.000Z'},
 groups:[{id:ids.group,title:'QA'}],columns:[{id:ids.column,name:'Reference',
 data_type:'text',column_key:'col_ref',system_key:null,config:{}}],items:[],values:[]};
const source='Name,Reference\nAlpha,A-1\nBeta,B-2\nGamma,C-3\n';
let sourceOverride=null;
const makeFile=()=>new File([sourceOverride||source],'QA-Durable.csv',{type:'text/csv'});
const clone=o=>structuredClone(o);
const getDb=()=>JSON.parse(localStorage.getItem('__disposable_fake_db')||'null')||clone(original);
const saveDb=o=>localStorage.setItem('__disposable_fake_db',JSON.stringify(o));
const auth={userId:ids.user,getVerifiedUser:async()=>({id:ids.user})};
let rpcWrites=0,finished=null;
const api={extendedRefsSupported:false,
 context:async()=>({user_id:ids.user,workspace_id:ids.workspace,profile:{status:'active'}}),
 allowed:async()=>true,board:async()=>getDb(),
 rpc:async(name,args)=>{
  if(name==='wm_board_ui_read')return {board_id:ids.board};
  if(name!=='wm_import_board_wizard_atomic')throw Error('Unexpected RPC: '+name);
  const db=getDb();
  if(args.p_expected_updated_at!==db.board.updated_at)throw Error('Stale board revision');
  rpcWrites++;
  for(const row of args.p_payload.rows){
   const index=db.items.length+1;
   const itemId='66666666-6666-4666-8666-'+String(index).padStart(12,'0');
   db.items.push({id:itemId,board_id:ids.board,group_id:ids.group,
    title:row.title,archived_at:null,updated_at:db.board.updated_at});
   db.values.push({item_id:itemId,column_id:ids.column,value:row.values.Reference});
  }
  db.board.updated_at=new Date(Date.parse(db.board.updated_at)+1000).toISOString();
  saveDb(db);
  return {created:args.p_payload.rows.length,updated:0,skipped:0,
   columnsCreated:0,groupsCreated:0};
 }};
window.bimp15Browser={
 resetRejected(){
  localStorage.clear();
  saveDb(clone(original));sourceOverride='Name,Reference\nValid One,R1\nInvalid,'+
   'Q'.repeat(1200)+'\nValid Two,R2\n';
  rpcWrites=0;finished=null;return true;
 },
 configureRejected(){
  const map=document.querySelector('[data-imp-map="1"]');
  if(!map)return false;
  map.value='existing:'+ids.column;
  map.dispatchEvent(new Event('change',{bubbles:true}));
  const group=document.querySelector('[data-imp-group]');
  group.value=ids.group;group.dispatchEvent(new Event('change',{bubbles:true}));
  return true;
 },
 async seed(){
  localStorage.clear();saveDb(clone(original));
  const parsed=await parseImportFile(makeFile());
  const sheet=parsed.sheets[0],mappings=initialImportMappings(sheet,original),
   group={action:'existing',groupId:ids.group},
   matches={behavior:'add-new',matchColumnId:'item'},
   approvedPlan=buildImportPlan({sheet,detail:original,mappings,group,matches});
  const db=getDb();db.items.push({id:'66666666-6666-4666-8666-000000000001',
   board_id:ids.board,group_id:ids.group,title:'Alpha',archived_at:null,
   updated_at:db.board.updated_at});
  db.values.push({item_id:db.items[0].id,column_id:ids.column,value:'A-1'});
  db.board.updated_at='2026-11-12T00:00:01.000Z';saveDb(db);
  const checkpoint={approvedPlan,boardId:ids.board,workspaceId:ids.workspace,
   detail:db,mappings,group,completed:1,receipt:{created:1,updated:0,
   skipped:0,columnsCreated:0,groupsCreated:0},batchSize:1};
  const marker=await sealImportRecovery({checkpoint,fullSheet:sheet,worksheetIndex:0,
   userId:ids.user,matches});
  const raw=JSON.stringify(marker);
  return {completed:marker.completed,rawContainsData:raw.includes('A-1')||raw.includes('Alpha'),
   persistedRows:getDb().items.length};
 },
 async launch(){
  await openBoardImportWizard({api,auth,boardId:ids.board,
   onComplete:async receipt=>{finished=receipt;}});
  return document.querySelector('.aps-import-dialog')?.textContent||'';
 },
 upload(){
  const input=document.querySelector('#aps-import-file-input');
  const transfer=new DataTransfer();transfer.items.add(makeFile());
  input.files=transfer.files;input.dispatchEvent(new Event('change',{bubbles:true}));
  return true;
 },
 click(action){document.querySelector('[data-imp="'+action+'"]')?.click();},
 confirm(){const el=document.querySelector('[data-imp-confirm]');
  if(!el)return false;el.checked=true;el.dispatchEvent(new Event('change',{bubbles:true}));return true;},
 state(){return {step:document.querySelector('.aps-import-steps')?.textContent,
  text:document.querySelector('.aps-import-dialog')?.textContent||'',
  items:getDb().items.length,values:getDb().values.map(x=>x.value),
  marker:!!readImportRecovery({userId:ids.user,boardId:ids.board}),
  writes:rpcWrites,finished};}
};
</script></body></html>
